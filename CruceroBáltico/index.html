centro de Copenhague para una última visita: Christiansborg (que no vimos el día 2), Christiania (el barrio alternativo), Carlsberg Brewery, o paseo por el barrio de Vesterbro.","less_time":"Si el vuelo es muy temprano (antes de las 11:00) y no os da tiempo a salir del barco con tranquilidad, hablad con la naviera para opción 'self-disembarkation' (lleváis vosotros las maletas, salida más rápida).","rainy_day":"El traslado del puerto al aeropuerto en taxi os resuelve cualquier mal tiempo."},"logistics":{"driving_km":8,"driving_time_min":25,"walking_km":0,"walking_time_min":0,"public_transport":"Oceankaj → CPH (aeropuerto): Taxi 25 min, 350–450 DKK. Bus 25 + metro/tren: 60 min, 36 DKK por persona."},"info":{"travel_tips":["El taxi del puerto al aeropuerto es la opción RECOMENDADA con maletas grandes: no son muchos euros más y os ahorra dos transbordos.","Reservar el taxi por adelantado con app Bolt o DanTaxi: aparece en 5 minutos.","En el aeropuerto de Copenhague hay duchas gratuitas en la zona de salidas internacionales (sector C): útil si os duchasteis poco en el barco y queréis llegar a casa frescos."],"access":["Oceankaj a CPH airport: 18 km, 25 min taxi.","Si volvéis al centro antes del vuelo: bus 25 al centro, después tren/metro al aeropuerto (Lufthavnen)."],"facts":["El aeropuerto de Copenhague gestiona casi 30 millones de pasajeros/año: es el más concurrido de Escandinavia.","Copenhague-Kastrup recibe el premio 'Best Airport in Northern Europe' año tras año por sus tiempos de control y la calidad del diseño escandinavo."]}}],"practical_tips":[{"icon":"🚢","title":"Logística de crucero","items":[{"subtitle":"Horario de embarque","text":"El embarque cierra siempre 1 hora antes de la salida. Si el barco zarpa a las 17:00, debéis estar a bordo antes de las 16:00. Llegar con 1,5 h de margen es lo recomendado."},{"subtitle":"Identificación","text":"Llevad SIEMPRE pasaporte (no DNI: aunque Polonia, Estonia, Letonia, Lituania y Finlandia están en Schengen, los controles del crucero exigen pasaporte). En Rusia ya no se entra: sin visado y suspendido para barcos europeos desde 2022."},{"subtitle":"Reloj a bordo","text":"El reloj del barco va en GMT+1 (hora central europea) durante todo el crucero. Estonia y Finlandia van en GMT+2: si bajáis allí, el barco mantiene su hora pero las atracciones funcionan en hora local. Ojo con esta diferencia, especialmente en Tallin y Helsinki."},{"subtitle":"Conexión a bordo","text":"El wifi del barco suele ser de pago (15–25 €/día). Solución barata: WiFi gratis en las terminales portuarias y en cafés del centro de cada ciudad. Comprad una eSIM europea (Holafly, Airalo) por 20 € para todo el viaje si necesitáis estar siempre conectados."}]},{"icon":"💱","title":"Monedas y tipos de cambio","items":[{"subtitle":"Resumen por país","text":"Dinamarca: corona danesa (DKK). Suecia: corona sueca (SEK). Polonia: zloty polaco (PLN). Alemania, Lituania, Letonia, Estonia y Finlandia: euro (EUR). El conversor del visor está configurado en DKK (la moneda principal del viaje)."},{"subtitle":"Tipos de cambio orientativos","text":"A mayo 2026: 1 EUR ≈ 7,47 DKK, 1 EUR ≈ 11 SEK, 1 EUR ≈ 4,30 PLN. Verificar el tipo de cambio actualizado en el conversor del visor o en xe.com."},{"subtitle":"Tarjeta vs efectivo","text":"Escandinavia es prácticamente cashless: Dinamarca, Suecia, Finlandia y Estonia funcionan al 99 % con tarjeta. Alemania y Polonia conservan más uso de efectivo: llevad 50–100 € en metálico para esos países por si acaso. El cambio en aeropuertos y puertos es siempre peor: cambiar lo justo."},{"subtitle":"Comisiones de tarjeta","text":"Pedid antes del viaje una tarjeta sin comisiones por cambio de divisa: Revolut, Wise, N26, BBVA Aqua, ING Direct. Las tarjetas tradicionales aplican 1–4 % de recargo por cada compra fuera del euro (DKK, SEK, PLN). Con 7-8 días en países no-euro, eso puede sumar 30-50 €."}]},{"icon":"🚇","title":"Transporte público en cada ciudad","items":[{"subtitle":"Copenhague (DKK)","text":"Metro, S-train y bus integrados. Ticket sencillo 2 zonas: 24 DKK. Mejor app: 'DOT Billetter'. Del aeropuerto al centro: metro M2, 15 min."},{"subtitle":"Rostock-Warnemünde (EUR)","text":"S-Bahn frecuente (S1, S2). Sencillo 2,80 €. Day ticket: 7 €. Validar siempre en las máquinas amarillas antes de subir."},{"subtitle":"Gdansk-Gdynia (PLN)","text":"SKM (Szybka Kolej Miejska) cada 7-15 min. Sencillo: 5,50 PLN (1,30 €). Validar en máquinas amarillas. App: SKM Trójmiasto."},{"subtitle":"Klaipėda, Riga, Tallin (EUR)","text":"Puertos directamente en el centro: no necesitáis transporte. En Riga el tranvía 11 cuesta 2 €."},{"subtitle":"Helsinki (EUR)","text":"Tranvía 2 es la 'línea turística'. Sencillo: 3,10 €. Day ticket 9 € (incluye ferry a Suomenlinna). App: HSL."},{"subtitle":"Estocolmo (SEK)","text":"Bus 76 conecta Frihamnen (puerto) con el centro. Sencillo: 39 SEK (3,50 €). Día completo: 165 SEK (15 €). App: SL."}]},{"icon":"💡","title":"Trucos para ahorrar","items":[{"subtitle":"Comer como un local","text":"Los menús del día (lunch deals) son la mitad del precio que cenar a la carta: 15–22 € en lugar de 30–45 €. Disponibles entre 11:30 y 14:30 en casi todas las ciudades. Algunos restaurantes ofrecen lunch buffet (especialmente en Helsinki y Estocolmo)."},{"subtitle":"Mercados gastronómicos","text":"Comer en los mercados cubiertos es excelente y barato: Torvehallerne (Copenhague), Vanha Kauppahalli (Helsinki), Hala Stara Mariacka (Gdansk), Centrāltirgus (Riga). Calidad alta a precio local."},{"subtitle":"Catedrales y iglesias gratis","text":"La mayoría de iglesias del Báltico se visitan gratis o por donativo: Catedral de Riga, Marienkirche de Rostock, Storkyrkan de Estocolmo, Iglesia del Espíritu Santo de Tallin, Catedral Luterana y Uspenski de Helsinki. Solo las torres tienen entrada (5–9 €)."},{"subtitle":"Free walking tours","text":"En casi todas las capitales (Copenhague, Gdansk, Tallin, Riga, Helsinki, Estocolmo) hay tours gratuitos diarios en inglés con propina al final. Buscad 'free walking tour [ciudad]' o usar GuruWalk."},{"subtitle":"Tarjetas turísticas","text":"Solo merecen la pena si pensáis visitar 4+ museos en una ciudad. Copenhagen Card (160 € 5 días): excesivo. Helsinki Card (51 €): incluye Suomenlinna ferry y descuentos. Tallinn Card (35 € 24h): para Lennusadam + Kadriorg sí compensa. Verificar siempre."}]},{"icon":"🏛️","title":"Cultura local y costumbres","items":[{"subtitle":"Saludo en cada idioma","text":"Aprended a decir 'gracias' en cada lengua local: en danés tak, alemán danke, polaco dziękuję (yen-kuyé), lituano ačiū (a-chiu), letón paldies, estonio aitäh, finés kiitos, sueco tack. Una palabra abre todas las puertas."},{"subtitle":"Propinas","text":"Escandinavia y Báltico: NO se deja propina obligatoria. Restaurantes incluyen servicio en el precio (Suecia, Dinamarca, Finlandia). Si el servicio ha sido excepcional, redondear al alza (5-10 %). En Polonia y Alemania, 10 % es estándar si os ha gustado."},{"subtitle":"Sauna finlandesa","text":"En Helsinki, si os atrevéis, la sauna pública Allas Sea Pool (junto al puerto, 18 €) es una buena introducción. El protocolo: desnudo (separado por género), sauna 10 min, agua fría, repetir. Es como un templo: respetar el silencio."},{"subtitle":"Puntualidad nórdica","text":"Los daneses, suecos y finlandeses son extremadamente puntuales. Si reserváis un restaurante a las 19:30, presentaos a las 19:25. Llegar 15 min tarde puede significar perder la reserva."},{"subtitle":"Iglesias ortodoxas","text":"En Uspenski (Helsinki) y Alexander Nevsky (Tallin): mujeres deben cubrirse la cabeza (pañuelos a la entrada), hombros y rodillas tapados, silencio absoluto. Hombres: descubrirse. No fotos durante misa."},{"subtitle":"Christiania (Copenhague)","text":"El barrio libre de Christiania es libre y autogestionado, pero respetad las normas no escritas: no fotos en Pusher Street (donde se vende cannabis abiertamente), comprar es ilegal aunque tolerado, los habitantes son cordiales pero a veces susceptibles."}]},{"icon":"🍴","title":"Gastronomía: qué probar en cada destino","items":[{"subtitle":"Copenhague (Dinamarca)","text":"Smørrebrød (tosta abierta con arenque/gambas/rosbif), frikadeller (albóndigas), kanelbulle (bollo de canela), salmón báltico ahumado. Beber: cerveza Carlsberg o Tuborg."},{"subtitle":"Rostock (Alemania)","text":"Mecklenburger Rippenbraten (cerdo asado), Heringssalat (ensalada de arenque), Sanddorn (espino amarillo, baya local). Cerveza: Rostocker Pilsner."},{"subtitle":"Gdansk (Polonia)","text":"Pierogi (empanadillas rellenas), żurek (sopa agria de centeno fermentado), bigos (estofado de col), goldwasser (licor de oro fino, especialidad de Danzig). Cerveza: Tyskie."},{"subtitle":"Klaipėda (Lituania)","text":"Cepelinai (zepelines de patata rellenos de carne), šaltibarščiai (sopa fría de remolacha rosa), kibinai (empanadillas de cordero). Cerveza: Švyturys."},{"subtitle":"Riga (Letonia)","text":"Aukstā zupa (sopa fría de remolacha), grey peas with bacon, sklandrausis (tarta de zanahoria y patata). Beber: Black Balsam (licor letón intenso, 45°), cerveza Aldaris."},{"subtitle":"Tallin (Estonia)","text":"Sült (gelatina de cerdo), verivorst (morcilla), kohuke (cuajada con chocolate), kama (harina de cereales fermentados). Beber: A. Le Coq (cerveza), Vana Tallinn (licor de ron y vainilla)."},{"subtitle":"Helsinki (Finlandia)","text":"Lohikeitto (sopa de salmón con eneldo), karjalanpiirakka (empanadillas de arroz), kalakukko (pan de pescado), salmiakki (regaliz salado de amoníaco — un gusto adquirido). Beber: Lapin Kulta (cerveza), Salmiakki Koskenkorva (vodka con regaliz)."},{"subtitle":"Estocolmo (Suecia)","text":"Köttbullar (albóndigas con puré, salsa y arándanos), gravlax (salmón curado), surströmming (arenque fermentado, solo para valientes), kanelbulle. Beber: aquavit, Falcon o Carlsberg."}]},{"icon":"🚨","title":"Seguridad y salud","items":[{"subtitle":"Nivel de seguridad","text":"El Báltico es una de las regiones más seguras de Europa. Tallin, Helsinki, Estocolmo y Copenhague tienen tasas de criminalidad muy bajas. Cuidado normal con pickpockets en zonas turísticas (Nyhavn, Plaza del Ayuntamiento de Tallin, Stortorget de Estocolmo, Gamla Stan). En Christiania (Copenhague) evitar Pusher Street por la noche."},{"subtitle":"Emergencias","text":"Marcad 112 desde cualquier teléfono móvil sin tarjeta para cualquier emergencia médica/policial. Funciona en los 8 países del viaje."},{"subtitle":"Tarjeta Sanitaria Europea (TSE)","text":"Imprescindible: cubre asistencia médica urgente en los 7 países UE del viaje (no en Reino Unido, ya fuera). Solicitarla online en seg-social.es con 4-6 semanas de antelación. Es gratuita."},{"subtitle":"Agua del grifo","text":"Potable y excelente en TODOS los destinos. No compréis agua embotellada en tiendas: rellenad la cantimplora del barco. Algunas ciudades (Copenhague, Estocolmo) tienen fuentes públicas decorativas."},{"subtitle":"Botiquín básico","text":"Llevad analgésicos (paracetamol), antihistamínicos, antidiarreicos, antiácidos, tiritas, antiséptico. Los medicamentos en farmacias del Báltico son caros: 2-3 veces más que en España."}]},{"icon":"🌡️","title":"Clima y ropa para septiembre","items":[{"subtitle":"Temperaturas septiembre","text":"Copenhague: 11-17°C. Rostock: 12-18°C. Gdansk: 11-17°C. Klaipėda y Riga: 10-16°C. Tallin: 10-15°C. Helsinki: 9-14°C. Estocolmo: 10-15°C. Frescos pero no fríos: equivalente a un noviembre suave en España."},{"subtitle":"Lluvia","text":"Septiembre es mes lluvioso en el Báltico: 8-15 días de lluvia/mes, mayoría llovizna corta. Imprescindible: chubasquero compacto o paraguas plegable. Evitar paraguas grandes (viento del mar los rompe)."},{"subtitle":"Sistema de capas","text":"La regla del Báltico: VESTIRSE POR CAPAS. Camiseta + jersey ligero + chaqueta cortavientos = mejor que un abrigo grueso. Las amplitudes térmicas día/noche son grandes (5-10°C de diferencia). Por la mañana hace frío en cubierta, al mediodía sol templado, al atardecer vuelve a refrescar."},{"subtitle":"Viento","text":"Septiembre trae vientos del oeste que pueden ser muy fríos en el barco. Una bufanda fina o pañuelo es muy útil para cubrir cuello y cabeza en cubierta."},{"subtitle":"Calzado","text":"Adoquines empedrados por todas partes (Tallin, Riga, Gdansk, Estocolmo, Copenhague). Zapatillas deportivas cómodas o botines bajos sin tacón. Olvidad sandalias, chanclas o tacones: tortura asegurada en el casco antiguo."}]}],"packing_list":{"summer_clothing":["Camisetas manga corta (3) — para días templados o interior del barco"],"winter_clothing":["Jerséis ligeros o sudaderas (2-3)","Pantalones largos cómodos (3-4)","Camiseta térmica fina (1) — útil para los días más fríos o cubiertas al amanecer","Chaqueta cortavientos / impermeable (1) — IMPRESCINDIBLE","Polar o fleece intermedio (1)"],"footwear":["Zapatillas deportivas cómodas para adoquines (1 par principal)","Botines bajos o zapatos cerrados de paseo (1 par alternativo)","Zapatos cómodos para cenar en el barco (1 par)","Chanclas para el camarote / piscina del barco"],"underwear":["Ropa interior (12 días + 2 extras)","Calcetines de algodón (12 + 2 extras)","Calcetines térmicos finos (2 pares) — para los días en cubierta","Pijama (2 cambios)"],"items":["Móvil + cargador","Batería externa (powerbank) 10.000 mAh mínimo","Gimbal con cargador y cables (especificado por el viajero)","Adaptador de enchufe: NO necesario en Dinamarca/Alemania/Polonia/Lituania/Letonia/Estonia/Finlandia (tipo F idéntico al español). SÍ en Suecia (tipo F también, pero algunos hoteles aún tienen variantes)","Paraguas plegable pequeño","Riñonera o bandolera anti-robo (cremallera oculta)","Cantimplora rellenable (agua del grifo potable)","Bolsa de tela plegable (para compras del día)","Candado pequeño (para taquilla del spa del barco)","Toalla de microfibra (para excursión a Suomenlinna o playa de Warnemünde)"],"accessories":["Gafas de sol","Gorra o sombrero ligero (para días soleados)","Gorro de lana fino (para amanecer en cubierta y cenas exteriores)","Bufanda fina o pañuelo (para viento del Báltico)","Cinturón"],"documents":["Pasaporte (válido al menos 6 meses) — IMPRESCINDIBLE, el DNI no es suficiente para el embarque","Tarjeta Sanitaria Europea (TSE) — solicitar con 4-6 semanas","DNI (segunda identificación)","Carnet de conducir (segunda identificación)","Billete del crucero impreso","Tarjetas de embarque del vuelo (digital + impresa)","Reservas de hotel Cabinn impresas","Tarjeta de crédito + tarjeta de débito (mejor 2 cada uno, una de respaldo)","Efectivo en euros (100-150 €) y reservar tarjeta sin comisiones","Seguro de viaje (incluido en muchas tarjetas premium)"],"toiletries":["Cepillo y pasta dental","Champú y gel (en envases pequeños para vuelo)","Desodorante","Crema hidratante (clima frío reseca la piel)","Cacao labial con SPF (viento marino reseca labios)","Pañuelos de papel","Crema solar SPF 30 (sol del Báltico engaña: la latitud alta hace que sea muy oblicuo pero penetrante)","Lentillas + líquido + gafas de respaldo (si aplica)","Maquinilla y gel de afeitar (si aplica)"],"health":["Analgésicos (paracetamol, ibuprofeno)","Antihistamínico (alergias inesperadas)","Antidiarreico (Fortasec) y suero oral","Antiácido / protector gástrico","Pastillas para mareo en barco (Biodramina) — útiles para algunos tramos del Báltico","Tiritas y antiséptico (Betadine)","Medicación crónica personal (con receta médica)","Repelente mosquitos (en septiembre el Báltico ya está calmado pero por si acaso)"]},"shopping":{"authentic_products":["Ámbar báltico (Gdansk, Klaipėda): joyería, esculturas. El Báltico produce el 80% del ámbar mundial","Diseño escandinavo (Copenhague, Helsinki, Estocolmo): Marimekko, Iittala, Hay, Royal Copenhagen, Fiskars","Cerámica nórdica (Royal Copenhagen, Arabia Finland)","Lana islandesa/feroesa (jerséis en tiendas especializadas de Copenhague)","Bombones daneses (Anthon Berg, Summerbird)","Vodka polaco (Wyborowa, Belvedere) y goldwasser de Gdansk","Black Balsam (licor letón de hierbas)","Vana Tallinn (licor estonio de ron y vainilla)","Salmiakki finlandés (regaliz salado, sabor único)","Cuero de reno (Helsinki, mercados de Skansen en Estocolmo)"],"avoid":["Souvenirs masivos 'made in China' alrededor de Plaza del Ayuntamiento de Tallin","Tiendas de ámbar en Mariacka (Gdansk) sin certificado: a menudo es plástico o copal","Restaurantes con menú en 5 idiomas en Nyhavn y Stortorget (precios disparados, calidad baja)","Cambios de moneda en aeropuertos y muelles de cruceros (tarifas pésimas)"],"best_places":["Strøget (Copenhague): la avenida de diseño danés","Ulica Mariacka (Gdansk): ámbar certificado en tiendas con tradición","Centrāltirgus (Riga): mercado central en hangares Zeppelin reciclados, pasillos de pescado, carne, verduras y artesanía","Marimekko Outlet Helsinki (Pohjoisesplanadi 33): seconds y outlet de la marca finlandesa estrella","Telliskivi Creative City (Tallin): diseñadores estonios independientes (Reet Aus, hattu)","NK y Åhléns (Estocolmo): grandes almacenes con todo el diseño sueco","Bornholms Markedshalle (Copenhague): mercado del producto local danés"]},"emergency":{"local_emergency":"112 (válido en todos los países del crucero: Dinamarca, Alemania, Polonia, Lituania, Letonia, Estonia, Finlandia, Suecia)","medical":"112 — los hospitales más cercanos en cada puerto: Copenhague: Rigshospitalet (Blegdamsvej 9). Rostock: Universitätsklinikum (Ernst-Heydemann-Str. 6). Gdansk: Szpital Marynarki Wojennej (Polanki 117). Tallin: Põhja-Eesti Regionaalhaigla (Sütiste tee 19). Helsinki: HUS Meilahden Sairaala (Haartmaninkatu 4). Estocolmo: Karolinska Universitetssjukhuset (Solna)","police":"112 (emergencias). Policía no urgente: Dinamarca 1813, Alemania 110, Polonia 997, Suecia 11414","embassy":"Embajada de España: Copenhague +45 35 42 47 00 · Berlín +49 30 254 0070 · Varsovia +48 22 583 4000 · Vilna +370 5 219 5450 · Riga +371 6732 0281 · Tallin +372 627 9970 · Helsinki +358 9 6877 080 · Estocolmo +46 8 411 9050","insurance_reminder":"Llevad la Tarjeta Sanitaria Europea (TSE) y un seguro de viaje complementario. La TSE cubre asistencia médica urgente en sistema sanitario público, pero no repatriación, gastos en sanidad privada o pérdida de equipaje. Muchas tarjetas de crédito premium (Visa Premier, Mastercard Gold) incluyen seguro de viaje básico si los vuelos se pagaron con ellas. Comprobad cobertura antes de salir."},"apps_recommended":[{"name":"Google Maps (offline)","purpose":"Descargad los mapas de las 8 ciudades antes de salir. Funcionan sin conexión y son la base de toda la navegación urbana."},{"name":"Google Translate (offline)","purpose":"Descargad los paquetes de danés, alemán, polaco, lituano, letón, estonio, finlandés y sueco. Función cámara traduce carteles y menús al instante."},{"name":"XE Currency","purpose":"Conversor de divisas para SEK, PLN y DKK. Cache la última tasa para uso sin conexión."},{"name":"DOT Billetter (Dinamarca)","purpose":"Compra de billetes de metro/tren/bus en Copenhague desde el móvil."},{"name":"Deutsche Bahn (Alemania)","purpose":"Horarios de S-Bahn entre Warnemünde y Rostock. Compra de billetes con descuento online."},{"name":"SKM Trójmiasto (Polonia)","purpose":"Tren urbano entre Gdynia, Sopot y Gdansk. Mucho más rápido que comprar en taquilla."},{"name":"HSL (Helsinki)","purpose":"Transporte público de Helsinki: tranvías, buses, metro, ferry a Suomenlinna. Billete sencillo y diario directamente desde el móvil."},{"name":"SL (Estocolmo)","purpose":"Transporte público de Estocolmo: metro, tranvía, bus 76 al puerto. Compra de billetes electrónicos."},{"name":"Bolt","purpose":"Alternativa más barata a Uber, ampliamente disponible en Tallin, Riga, Helsinki, Estocolmo y Gdansk. Tarifas un 20-30% inferiores a Uber."},{"name":"Uber","purpose":"Disponible en Helsinki, Estocolmo, Tallin y Copenhague. No funciona en Klaipėda, Riga ni Rostock (usar Bolt o taxis locales)."},{"name":"WhatsApp Web/Desktop","purpose":"Estar conectado con la familia en España sin gastar datos del crucero: el wifi del puerto en cada ciudad permite videollamadas."},{"name":"Yr (clima nórdico)","purpose":"App noruega gratuita y la más precisa para clima del Báltico. Predicción de lluvia por horas. Imprescindible en septiembre."},{"name":"GuruWalk","purpose":"Buscar free walking tours en español/inglés en cada ciudad. Disponibles en Copenhague, Gdansk, Tallin, Riga, Helsinki y Estocolmo."},{"name":"Holafly eSIM","purpose":"eSIM europea para datos sin roaming (alternativa: Airalo, ya integradas en iPhone y Android modernos). Pack 12 días Europa: 20-30 €."},{"name":"Tallink (ferry Helsinki-Tallin)","purpose":"Solo si quisierais hacer alguna excursión extra; en este crucero no aplica."}],"generation_metadata":{"generated_at":"2026-05-16T07:31:22.409182+00:00","schema_version":"1.2","claude_model":"Claude Opus 4.7","web_search_count":12,"verification_note":"Búsquedas web sobre clima, distancias, ventanas portuarias y atracciones. Datos verificados a mayo 2026. Precios de entradas y horarios verificar in situ por temporada. Tipos de cambio: 1 EUR ≈ 7,47 DKK / 11 SEK / 4,30 PLN (verificados 15-may-2026)."}}

<script>
(function () {
  'use strict';

  // ------------------------------------------------------
  // 1. CARGA DE DATOS Y STORAGE
  // ------------------------------------------------------
  const DATA = JSON.parse(document.getElementById('guide-data').textContent);
  const SLUG = (DATA.meta?.destination?.name || 'guia').toLowerCase().replace(/\s+/g, '-');
  const STORE_KEY = 'guia_' + SLUG + '_v1';

  const defaultStore = {
    checklist: {},       // { "day1_tl3": true, ... }
    notes: {},           // { "day1": "texto", ... }
    expenses: [],        // [{ id, day, category, desc, amount, date }]
    packing: {},         // { "clothing_0": true, ... }
    packing_custom: null,// items añadidos/editados por el usuario (override de DATA.packing_list)
    budget_edit: null,   // { breakdown } editado por el usuario
    split: null,         // { people: [], expenses: [] } gastos compartidos
    theme: null          // "light" | "dark" | null (= auto)
  };

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return { ...defaultStore };
      return { ...defaultStore, ...JSON.parse(raw) };
    } catch (e) { return { ...defaultStore }; }
  }
  function saveStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
  }

  const store = loadStore();

  // ------------------------------------------------------
  // 2. UTILIDADES
  // ------------------------------------------------------
  const fmtDate = (isoDate, opts = { day: 'numeric', month: 'short' }) => {
    const d = new Date(isoDate + 'T00:00:00');
    return d.toLocaleDateString('es-ES', opts);
  };
  const fmtMoney = (n, currency = 'EUR') => {
    return new Intl.NumberFormat('es-ES', { style: 'currency', currency, maximumFractionDigits: 0 }).format(n);
  };
  const el = (sel) => document.querySelector(sel);
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const todayISO = () => new Date().toISOString().slice(0, 10);

  function getCurrentTripDay() {
    const today = todayISO();
    const d = DATA.days.find(d => d.date === today);
    return d || null;
  }

  // ------------------------------------------------------
  // 3. TEMA (modo oscuro)
  // ------------------------------------------------------
  function applyTheme() {
    let t = store.theme;
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = t === 'dark' ? '#14110E' : (DATA.meta?.theme_color || '#C65D3A');
  }
  el('#btn-theme').addEventListener('click', () => {
    const current = document.documentElement.dataset.theme;
    store.theme = current === 'dark' ? 'light' : 'dark';
    saveStore();
    applyTheme();
  });
  applyTheme();

  // Tema dinámico desde el JSON
  if (DATA.meta?.theme_color) {
    document.documentElement.style.setProperty('--accent', DATA.meta.theme_color);
  }

  // --- MAP ------------------------------------------------
  let mapInstance = null;
  let mapLoadAttempts = 0;
  function renderMap() {
    if (!window.L) {
      mapLoadAttempts++;
      if (mapLoadAttempts > 20) {  // ~4 segundos
        el('#map').innerHTML = `<div class="empty-state" style="padding:40px 20px">
          🗺️ <br><br>
          <strong>Mapa no disponible</strong><br>
          <span style="font-size:13px">Este archivo necesita conexión para cargar los mapas.<br>Los datos del itinerario siguen disponibles en las otras pestañas.</span>
        </div>`;
        return;
      }
      setTimeout(renderMap, 200);
      return;
    }
    const om = DATA.overview_map;
    if (!om) { el('#map').innerHTML = '<p style="padding:20px">Sin datos de mapa.</p>'; return; }

    try {
      if (mapInstance) { mapInstance.remove(); mapInstance = null; }

      mapInstance = L.map('map', { zoomControl: true, attributionControl: true })
        .setView([om.center.lat, om.center.lng], om.zoom || 8);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(mapInstance);

      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

      (om.markers || []).forEach(m => {
        const icon = L.divIcon({
          className: 'custom-marker',
          html: `<div style="width:30px;height:30px;background:${accent};color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid #fff">${m.day}</div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });
        L.marker([m.coords.lat, m.coords.lng], { icon })
          .addTo(mapInstance)
          .bindPopup(`<strong>${esc(m.name)}</strong><br><small>Día ${m.day}</small><br><a href="#" onclick="window.__nav.goDay(${m.day});return false;">Ver día →</a>`);
      });
    } catch (err) {
      console.error('Error al inicializar el mapa:', err);
      el('#map').innerHTML = `<div class="empty-state" style="padding:40px 20px">
        ⚠️ Error al cargar el mapa.<br>
        <small>${esc(err.message || 'Desconocido')}</small>
      </div>`;
    }
  }

  // --- TIPS -----------------------------------------------
  function renderTips() {
    // Separar los tips normales de los que son de apps (para fusionarlos con apps_recommended)
    const appKeywords = ['app', 'apps', 'aplicacion', 'aplicaciones'];
    const isAppGroup = (g) => appKeywords.some(kw => g.title.toLowerCase().includes(kw));

    const normalTips = (DATA.practical_tips || []).filter(g => !isAppGroup(g));
    const appTipGroups = (DATA.practical_tips || []).filter(g => isAppGroup(g));

    // Fusionar items de apps de practical_tips + apps_recommended en un solo grupo
    const appItems = [];
    appTipGroups.forEach(g => {
      (g.items || []).forEach(i => appItems.push(i));
    });
    // Añadir apps_recommended como items adicionales (evitando duplicados por nombre)
    const existingNames = new Set(appItems.map(i => i.subtitle.toLowerCase()));
    (DATA.apps_recommended || []).forEach(a => {
      if (!existingNames.has(a.name.toLowerCase())) {

  // --- ME (checklist, presupuesto, packing, herramientas) --
  function totalExpenses() {
    return store.expenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
  }
  function overallProgress() {
    const allKeys = DATA.days.flatMap(d => (d.timeline || []).map((_, idx) => `d${d.day}_t${idx}`));
    if (!allKeys.length) return 0;
    const done = allKeys.filter(k => store.checklist[k]).length;
    return Math.round((done / allKeys.length) * 100);
  }
  function packingProgress() {
    const groups = store.packing_custom || DATA.packing_list || {};
    let total = 0, done = 0;
    Object.keys(groups).forEach(cat => {
      (groups[cat] || []).forEach((_, idx) => {
        total++;
        if (store.packing[`${cat}_${idx}`]) done++;
      });
    });
    return total ? Math.round((done / total) * 100) : 0;
  }

    const tabs = [
      { k: 'overview', l: 'Resumen' },

    renderMeOverview();

    const curr = DATA.meta.currency || 'EUR';

    const paneEl = document.querySelector('[data-me-pane="overview"]');

    paneEl.innerHTML = `
      <div class="stats-grid">

  async function loadWeather() {
    const w = document.getElementById('weather-content');
    if (!w) return;
    const om = DATA.overview_map;
    if (!om) { w.textContent = 'Sin coordenadas.'; return; }

    const start = DATA.meta.dates.start;
    const end   = DATA.meta.dates.end;
    const lat   = om.center.lat;
    const lng   = om.center.lng;

    const today     = new Date(); today.setHours(0,0,0,0);
    const tripStart = new Date(start + 'T00:00:00');
    const tripEnd   = new Date(end   + 'T00:00:00');
    const daysUntilStart = Math.round((tripStart - today) / 86400000);
    const FORECAST_WINDOW = 14; // días que Open-Meteo garantiza con fiabilidad

    const codes = {
      0:'☀️', 1:'🌤', 2:'⛅', 3:'☁️', 45:'🌫', 48:'🌫',
      51:'🌦', 53:'🌦', 55:'🌦', 61:'🌧', 63:'🌧', 65:'🌧',
      71:'🌨', 73:'🌨', 75:'🌨', 80:'🌦', 81:'🌧', 82:'⛈',
      95:'⛈', 96:'⛈', 99:'⛈'
    };

    function renderGrid(days, label) {
      const html = days.map(d => `
        <div class="weather-day">
          <div class="weather-day__date">${fmtDate(d.date, { weekday: 'short', day: 'numeric' })}</div>
          <div class="weather-day__icon">${d.icon}</div>
          <div class="weather-day__temp">${d.max}° <span class="weather-day__temp-min">${d.min}°</span></div>
        </div>`).join('');
      const note = label ? `<p style="font-size:11px;color:var(--text-muted);margin:8px 0 0;text-align:center">${label}</p>` : '';
      w.outerHTML = `<div id="weather-content">${note}<div class="weather-grid">${html}</div></div>`;
    }

    // ── CASO 1: viaje ya pasó ────────────────────────────────────────────
    if (tripEnd < today) {
      w.innerHTML = '<span style="color:var(--text-muted);font-size:13px">El viaje ya ha finalizado.</span>';
      return;
    }

    // ── CASO 2: viaje dentro del rango de previsión (≤14 días) ──────────
    if (daysUntilStart <= FORECAST_WINDOW) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${start}&end_date=${end}`;
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        if (!j.daily || !j.daily.time.length) throw new Error('sin datos');
        const days = j.daily.time.map((t, i) => ({
          date: t,
          icon: codes[j.daily.weather_code[i]] || '🌡',
          max:  Math.round(j.daily.temperature_2m_max[i]),
          min:  Math.round(j.daily.temperature_2m_min[i])
        }));
        renderGrid(days, null);
        return;
      } catch (e) {
        w.textContent = 'Error al obtener la previsión. Comprueba tu conexión.';
        return;
      }
    }

    // ── CASO 3: viaje a más de 14 días → datos históricos del año anterior
    // Calculamos las mismas fechas del año pasado para obtener el clima típico
    const lastYearStart = start.replace(/^(\d{4})/, y => String(parseInt(y) - 1));
    const lastYearEnd   = end.replace(/^(\d{4})/, y => String(parseInt(y) - 1));
    const availableFrom = new Date(tripStart);
    availableFrom.setDate(availableFrom.getDate() - FORECAST_WINDOW);
    const availableFromStr = availableFrom.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });

    try {
      const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&start_date=${lastYearStart}&end_date=${lastYearEnd}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      if (!j.daily || !j.daily.time.length) throw new Error('sin datos');
      const days = j.daily.time.map((t, i) => ({
        date: t.replace(/^(\d{4})/, y => String(parseInt(y) + 1)), // mostrar con fecha real del viaje
        icon: codes[j.daily.weather_code[i]] || '🌡',
        max:  Math.round(j.daily.temperature_2m_max[i]),
        min:  Math.round(j.daily.temperature_2m_min[i])
      }));
      renderGrid(days,
        `📅 Previsión disponible aprox. el ${availableFromStr} · Datos: mismo periodo del año anterior`
      );
    } catch (e) {
      // Fallback: mensaje claro sin datos históricos
      w.innerHTML = `<span style="font-size:13px;color:var(--text-muted)">
        La previsión meteorológica estará disponible aprox. el <strong>${availableFromStr}</strong>.
        El viaje empieza en ${daysUntilStart} días, fuera del rango de previsión (${FORECAST_WINDOW} días).
        Vuelve más cerca de la fecha para ver el tiempo real.
      </span>`;
    }
  }

          </div>`).join('')}

        <hr class="divider" style="margin:12px 0 10px">
        <div class="budget-row">

        </div>

        <div class="budget-row" style="margin-top:6px">
          <span class="budget-row__label">Restante</span>

        </div>
      </div>

      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin:20px 0 8px">Añadir gasto</div>
      <div class="expense-form">
        <input id="exp-desc" placeholder="Concepto">
        <input id="exp-amount" type="number" step="0.01" placeholder="€">
        <select id="exp-cat">${categories.map(c => `<option>${c}</option>`).join('')}</select>
        <button id="exp-add">+</button>
      </div>
      <ul class="expense-list" id="exp-list">
        ${store.expenses.length === 0 ? '<li class="empty-state">Aún no has añadido gastos.</li>' : ''}
        ${store.expenses.slice().reverse().map(e => `
          <li class="expense-item">
            <div>
              <div class="expense-item__desc">${esc(e.desc)}</div>
              <div class="expense-item__cat">${esc(e.category)}</div>

          </li>`).join('')}
      </ul>
    `;

    // --- Sección gastos compartidos ---
    const sp = store.split;
    const today = todayISO();

    // Calcular balances netos: para cada gasto, cada beneficiario debe su parte proporcional
    const balances = {}; // balance positivo = le deben, negativo = debe
    sp.people.forEach(p => { balances[p] = 0; });
    const splitGrandTotal = sp.expenses.reduce((s, e) => s + e.amount, 0);

    sp.expenses.forEach(e => {
      const beneficiaries = (e.forWhom && e.forWhom.length > 0) ? e.forWhom : sp.people;
      const share = e.amount / beneficiaries.length;
      // El pagador adelanta el total
      balances[e.paidBy] = (balances[e.paidBy] || 0) + e.amount;
      // Cada beneficiario "consume" su parte
      beneficiaries.forEach(b => {
        balances[b] = (balances[b] || 0) - share;
      });
    });

    // Calcular transferencias mínimas para liquidar
    function calcTransfers(bal) {
      const debtors = []; // deben dinero (balance negativo)
      const creditors = []; // les deben (balance positivo)
      Object.keys(bal).forEach(p => {
        const b = Math.round(bal[p] * 100) / 100;
        if (b < -0.01) debtors.push({ name: p, amount: -b });
        else if (b > 0.01) creditors.push({ name: p, amount: b });
      });
      // Ordenar de mayor a menor para minimizar transferencias
      debtors.sort((a,b) => b.amount - a.amount);
      creditors.sort((a,b) => b.amount - a.amount);

      const transfers = [];
      let di = 0, ci = 0;
      while (di < debtors.length && ci < creditors.length) {
        const pay = Math.min(debtors[di].amount, creditors[ci].amount);
        if (pay > 0.01) {
          transfers.push({ from: debtors[di].name, to: creditors[ci].name, amount: Math.round(pay * 100) / 100 });
        }
        debtors[di].amount -= pay;
        creditors[ci].amount -= pay;
        if (debtors[di].amount < 0.01) di++;
        if (creditors[ci].amount < 0.01) ci++;
      }
      return transfers;
    }

    const transfers = sp.expenses.length > 0 ? calcTransfers({...balances}) : [];

    // Cuánto ha pagado cada persona en total
    const totalPaid = {};
    sp.people.forEach(p => { totalPaid[p] = 0; });
    sp.expenses.forEach(e => { totalPaid[e.paidBy] = (totalPaid[e.paidBy] || 0) + e.amount; });

          <div style="display:grid;grid-template-columns:1fr 70px;gap:6px;margin-bottom:6px">
            <input id="split-desc" placeholder="Concepto" style="padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;min-width:0">
            <input id="split-amount" type="number" step="0.01" placeholder="€" style="padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center">
            <div>
              <label style="font-size:11px;color:var(--text-muted);font-weight:600">Pagó</label>

                ${sp.people.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label style="font-size:11px;color:var(--text-muted);font-weight:600">Fecha</label>
              <input id="split-date" type="date" value="${today}" style="width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;margin-top:2px">
            </div>
            <button id="split-add-exp" class="btn btn--primary btn--sm" style="align-self:end;margin-bottom:1px">+</button>

            <div id="split-for-whom" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">
              ${sp.people.map(p => `

                const forLabel = (e.forWhom && e.forWhom.length > 0 && e.forWhom.length < sp.people.length)
                  ? e.forWhom.join(', ')

                return `

                    <div class="expense-item__cat">Pagó: ${esc(e.paidBy)} · Para: ${esc(forLabel)} · ${esc(e.date || '')}</div>

        ` : sp.people.length === 1 ? '<p style="font-size:13px;color:var(--text-muted)">Añade al menos 2 viajeros para usar los gastos compartidos.</p>' : ''}
      </div>
    `;

    paneEl.innerHTML = budgetHTML + splitHTML;

    // --- Listeners para partidas del presupuesto ---
    document.querySelectorAll('[data-bd-key]').forEach(inp => {
      inp.addEventListener('change', () => {
        store.budget_edit.breakdown[inp.dataset.bdKey] = parseFloat(inp.value) || 0;
        saveStore();
        const newTotal = bdKeys.reduce((s, k) => s + (store.budget_edit.breakdown[k] || 0), 0);

        if (totalEl) totalEl.textContent = fmtMoney(newTotal, curr);

      renderMeBudget();
      renderMeOverview();

        store.expenses = store.expenses.filter(e => e.id !== b.dataset.del);

        renderMeOverview();

    if (addPersonBtn) {
      const doAddPerson = () => {
        const name = newPersonInp.value.trim();
        if (!name || store.split.people.includes(name)) return;
        store.split.people.push(name);

        renderMeBudget();
      };
      addPersonBtn.addEventListener('click', doAddPerson);
      newPersonInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doAddPerson(); } });
    }

    document.querySelectorAll('[data-rm-person]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.rmPerson);
        const removed = store.split.people[idx];
        store.split.people.splice(idx, 1);
        store.split.expenses = store.split.expenses.filter(e => e.paidBy !== removed);
        // También limpiar de forWhom
        store.split.expenses.forEach(e => {
          if (e.forWhom) e.forWhom = e.forWhom.filter(p => p !== removed);

        saveStore();
        renderMeBudget();
      });
    });

    const addSplitBtn = document.getElementById('split-add-exp');
    if (addSplitBtn) {
      addSplitBtn.addEventListener('click', () => {
        const desc = document.getElementById('split-desc').value.trim();
        const amount = parseFloat(document.getElementById('split-amount').value);
        const who = document.getElementById('split-who').value;
        const date = document.getElementById('split-date').value || todayISO();
        // Leer beneficiarios seleccionados
        const checkboxes = document.querySelectorAll('#split-for-whom input[type="checkbox"]');
        const forWhom = [];
        checkboxes.forEach(cb => { if (cb.checked) forWhom.push(cb.value); });
        if (!desc || !amount || isNaN(amount) || !who || forWhom.length === 0) {
          if (forWhom.length === 0) alert('Selecciona al menos una persona como beneficiario del gasto.');
          return;
        }
        store.split.expenses.push({ desc, amount, paidBy: who, forWhom, date });
        saveStore();
        renderMeBudget();
      });
    }

    document.querySelectorAll('[data-del-split]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.delSplit);
        store.split.expenses.splice(idx, 1);
        saveStore();
        renderMeBudget();
      });
    });
  }

  function getPackingData() {
    // Si el usuario ha editado, usa la copia custom. Si no, parte de DATA.
    if (store.packing_custom) return JSON.parse(JSON.stringify(store.packing_custom));
    return JSON.parse(JSON.stringify(DATA.packing_list || {}));
  }
  function savePackingData(pl) {
    store.packing_custom = pl;
    saveStore();
  }

  function renderMePacking() {
    const paneEl = document.querySelector('[data-me-pane="packing"]');
    if (!paneEl) return;
    const pl = getPackingData();
    const labels = {
      summer_clothing: '☀️ Ropa de verano', winter_clothing: '🧥 Ropa de invierno',
      footwear: '👟 Calzado', underwear: '🩲 Ropa interior', items: '🎒 Objetos',
      accessories: '🧢 Complementos', documents: '📄 Documentación',
      toiletries: '🧴 Bolsa de aseo', health: '💊 Salud', other: '📦 Otros',
      clothing: '👕 Ropa', tech: '🔌 Tecnología'
    };
    const preferredOrder = [
      'summer_clothing', 'winter_clothing', 'clothing', 'footwear', 'underwear',
      'items', 'tech', 'accessories', 'documents', 'toiletries', 'health', 'other'
    ];
    const orderedKeys = preferredOrder.filter(k => pl[k] && pl[k].length > 0).concat(
      Object.keys(pl).filter(k => !preferredOrder.includes(k) && pl[k] && pl[k].length > 0)
    );

    if (orderedKeys.length === 0) {
      paneEl.innerHTML = '<div class="empty-state">Sin lista de equipaje definida.</div>';
      return;
    }

    paneEl.innerHTML = orderedKeys.map(cat => `
      <div class="packing-group" data-cat="${cat}">
        <div class="packing-group__title">${labels[cat] || '📦 ' + cat}</div>
        ${(pl[cat] || []).map((item, idx) => {
          const key = `${cat}_${idx}`;
          const packed = !!store.packing[key];
          return `
            <div class="packing-item ${packed ? 'is-packed' : ''}" data-pack-key="${key}" data-cat="${cat}" data-idx="${idx}">
              <span class="packing-item__box" data-action="toggle"></span>
              <input class="packing-item__edit" type="text" value="${esc(item)}" data-action="rename">
              <button class="packing-item__remove" data-action="remove" title="Eliminar">✕</button>
            </div>`;
        }).join('')}
        <div class="packing-add-row">
          <input class="packing-add-input" data-add-cat="${cat}" placeholder="Añadir item…" type="text">
          <button class="packing-add-btn" data-add-btn="${cat}">+</button>
        </div>
      </div>`).join('') + `
      <div style="margin-top:12px">
        <button class="btn btn--ghost btn--sm" id="packing-reset" style="font-size:12px">↩ Restaurar lista original</button>
      </div>`;

    // Toggle check
    paneEl.querySelectorAll('[data-action="toggle"]').forEach(box => {
      box.addEventListener('click', () => {
        const item = box.closest('[data-pack-key]');
        const k = item.dataset.packKey;
        store.packing[k] = !store.packing[k];
        saveStore();
        item.classList.toggle('is-packed');
        renderMeOverview();
      });
    });

    // Rename inline
    paneEl.querySelectorAll('[data-action="rename"]').forEach(inp => {
      inp.addEventListener('change', () => {
        const item = inp.closest('[data-pack-key]');
        const cat = item.dataset.cat;
        const idx = parseInt(item.dataset.idx);
        const plData = getPackingData();
        if (plData[cat] && plData[cat][idx] !== undefined) {
          plData[cat][idx] = inp.value.trim() || plData[cat][idx];
          savePackingData(plData);
        }
      });
    });

    // Remove item
    paneEl.querySelectorAll('[data-action="remove"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('[data-pack-key]');
        const cat = item.dataset.cat;
        const idx = parseInt(item.dataset.idx);
        const plData = getPackingData();
        if (plData[cat]) {
          plData[cat].splice(idx, 1);
          // Also clean packing checks for this category (re-index)
          const newPacking = {};
          Object.keys(store.packing).forEach(k => {
            if (!k.startsWith(cat + '_')) newPacking[k] = store.packing[k];
          });
          (plData[cat] || []).forEach((_, i) => {
            // preserve check state by old position if possible
          });
          store.packing = newPacking;
          savePackingData(plData);
          renderMePacking();
          renderMeOverview();
        }
      });
    });

    // Add item
    paneEl.querySelectorAll('[data-add-btn]').forEach(btn => {
      const cat = btn.dataset.addBtn;
      const inp = paneEl.querySelector(`[data-add-cat="${cat}"]`);
      const doAdd = () => {
        const val = inp.value.trim();
        if (!val) return;
        const plData = getPackingData();
        if (!plData[cat]) plData[cat] = [];
        plData[cat].push(val);
        savePackingData(plData);
        inp.value = '';
        renderMePacking();
        renderMeOverview();
      };
      btn.addEventListener('click', doAdd);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
    });

    // Reset to original
    document.getElementById('packing-reset')?.addEventListener('click', () => {
      if (confirm('¿Restaurar la lista original? Se perderán los cambios que hayas hecho.')) {
        store.packing_custom = null;
        store.packing = {};
        saveStore();
        renderMePacking();
        renderMeOverview();
      }
    });
  }

  function renderMeTools() {
    const paneEl = document.querySelector('[data-me-pane="tools"]');
    if (!paneEl) return;

    // Detectar moneda local del destino: primero local_currency, luego currency si no es EUR, luego nada
    const homeCurr = 'EUR';
    const rawCurr = DATA.meta.local_currency || DATA.meta.currency || 'EUR';
    const destCurr = rawCurr === homeCurr ? null : rawCurr;

    const converterHTML = !destCurr ? '' : `
      <div class="tool-card">
        <div class="tool-card__title">💱 Conversor EUR ↔ ${esc(destCurr)}</div>

        <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em">EUR → ${esc(destCurr)}</div>
        <div class="tool-card__row" style="margin-bottom:4px">
          <input id="conv-eur" type="number" placeholder="Euros" value="100">
          <div style="align-self:center;font-weight:700;font-size:14px;color:var(--accent)">EUR</div>
        </div>
        <div class="tool-card__result" id="conv-result-fwd">—</div>

        <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:0.06em">${esc(destCurr)} → EUR</div>
        <div class="tool-card__row" style="margin-bottom:4px">
          <input id="conv-local" type="number" placeholder="${esc(destCurr)}" value="">
          <div style="align-self:center;font-weight:700;font-size:14px;color:var(--accent)">${esc(destCurr)}</div>
        </div>
        <div class="tool-card__result" id="conv-result-rev">—</div>

        <small id="conv-rate" style="display:block;margin-top:8px;color:var(--text-muted);font-size:11px"></small>
      </div>`;

    paneEl.innerHTML = `
      ${converterHTML}

      <div class="tool-card">
        <div class="tool-card__title">📤 Compartir esta guía</div>
        <p style="font-size:13px;color:var(--text-soft);margin-bottom:12px">Comparte el enlace de tu guía por WhatsApp, email o redes sociales.</p>
        <button class="btn btn--primary" onclick="navigator.share ? navigator.share({title: document.title, text: 'Mira mi guía de viaje', url: location.href}).catch(()=>{}) : alert('Copia la URL del navegador y compártela')">Compartir</button>
      </div>
    `;

    if (destCurr) {
      const eurInput = document.getElementById('conv-eur');
      const localInput = document.getElementById('conv-local');
      const resFwd = document.getElementById('conv-result-fwd');
      const resRev = document.getElementById('conv-result-rev');
      const rateEl = document.getElementById('conv-rate');
      let cachedRate = null;

      async function fetchRate() {
        if (cachedRate) return cachedRate;
        // Intentar con open.er-api.com (gratis, sin key, fiable)
        try {
          const r = await fetch('https://open.er-api.com/v6/latest/EUR');
          const j = await r.json();
          if (j.result === 'success' && j.rates && j.rates[destCurr]) {
            cachedRate = j.rates[destCurr];
            rateEl.textContent = '1 EUR = ' + cachedRate.toFixed(4) + ' ' + destCurr + ' (actualizado ' + (j.time_last_update_utc || 'hoy').split(' ').slice(0,4).join(' ') + ')';
            return cachedRate;
          }
        } catch (e) {}
        // Fallback: exchangerate.host
        try {
          const r2 = await fetch('https://api.exchangerate.host/latest?base=EUR&symbols=' + destCurr);
          const j2 = await r2.json();
          if (j2.rates && j2.rates[destCurr]) {
            cachedRate = j2.rates[destCurr];
            rateEl.textContent = '1 EUR = ' + cachedRate.toFixed(4) + ' ' + destCurr;
            return cachedRate;
          }
        } catch (e) {}
        rateEl.textContent = 'Sin conexión para obtener tasas';
        return null;
      }

      async function convertFwd() {
        const a = parseFloat(eurInput.value) || 0;
        const rate = await fetchRate();
        if (rate) {
          const result = a * rate;
          resFwd.textContent = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 0 }).format(result) + ' ' + destCurr;
        } else {
          resFwd.textContent = 'Error';
        }
      }
      async function convertRev() {
        const a = parseFloat(localInput.value) || 0;
        const rate = await fetchRate();
        if (rate) {
          const result = a / rate;
          resRev.textContent = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 }).format(result);
        } else {
          resRev.textContent = 'Error';
        }
      }

      eurInput.addEventListener('input', convertFwd);
      localInput.addEventListener('input', convertRev);
      convertFwd();
    }
  }

  // ------------------------------------------------------
  // 5. ACCIONES GLOBALES
  // ------------------------------------------------------
  window.__actions = {
    toggleChecklist(key) {
      store.checklist[key] = !store.checklist[key];
      saveStore();
      const item = document.querySelector(`[data-key="${key}"]`);
      if (item) item.classList.toggle('is-done');
    }
  };

  // ------------------------------------------------------
  // 6. NAVEGACIÓN
  // ------------------------------------------------------
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('is-active'));
    el('#page-' + id).classList.add('is-active');
    window.scrollTo(0, 0);

    document.querySelectorAll('.tabbar__item').forEach(b => {
      b.classList.toggle('is-active', b.dataset.tab === id || (id === 'day' && b.dataset.tab === 'days'));
    });

    // (Re)renderizar contenido según la página
    switch (id) {
      case 'home': renderHome(); break;
      case 'days': renderDaysList(); el('#header-title').textContent = 'Itinerario'; break;
      case 'map':  renderMap(); el('#header-title').textContent = 'Mapa'; break;
      case 'tips': renderTips(); el('#header-title').textContent = 'Consejos'; break;
      case 'me':   renderMe(); el('#header-title').textContent = 'Mi viaje'; break;
    }
  }

  window.__nav = {
    go(id) { showPage(id); },
    goDay(n) { renderDay(n); showPage('day'); }
  };

  document.querySelectorAll('.tabbar__item').forEach(btn => {
    btn.addEventListener('click', () => showPage(btn.dataset.tab));
  });

  // ------------------------------------------------------
  // 7. BUSCADOR GLOBAL
  // ------------------------------------------------------
  function buildSearchIndex() {
    const idx = [];
    DATA.days.forEach(d => {
      idx.push({ type: 'Día', title: `Día ${d.day}: ${d.title}`, snippet: DATA.summary.find(s => s.day === d.day)?.summary || '', action: () => window.__nav.goDay(d.day) });
      (d.timeline || []).forEach(t => idx.push({ type: `Día ${d.day}`, title: `${t.time} · ${t.title}`, snippet: t.description, action: () => window.__nav.goDay(d.day) }));
      (d.places || []).forEach(p => idx.push({ type: `Día ${d.day} · Lugar`, title: p.name, snippet: p.review || '', action: () => window.__nav.goDay(d.day) }));
      (d.restaurants || []).forEach(r => idx.push({ type: `Día ${d.day} · Restaurante`, title: r.name, snippet: r.speciality || '', action: () => window.__nav.goDay(d.day) }));
    });
    (DATA.practical_tips || []).forEach(g => {
      (g.items || []).forEach(i => idx.push({ type: `Consejo · ${g.title}`, title: i.subtitle, snippet: i.text, action: () => window.__nav.go('tips') }));
    });
    return idx;
  }

  const searchIndex = buildSearchIndex();
  const searchOverlay = el('#search-overlay');
  const searchInput = el('#search-input');
  const searchResults = el('#search-results');

  el('#btn-search').addEventListener('click', () => {
    searchOverlay.classList.add('is-open');
    searchInput.value = '';
    searchResults.innerHTML = '';
    setTimeout(() => searchInput.focus(), 60);
  });
  el('#search-close').addEventListener('click', () => searchOverlay.classList.remove('is-open'));

  function normalize(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  searchInput.addEventListener('input', () => {
    const q = normalize(searchInput.value.trim());
    if (q.length < 2) { searchResults.innerHTML = ''; return; }
    const matches = searchIndex
      .map(it => ({ it, score: (normalize(it.title).includes(q) ? 2 : 0) + (normalize(it.snippet).includes(q) ? 1 : 0) }))
      .filter(x => x.score > 0)
      .sort((a,b) => b.score - a.score)
      .slice(0, 30);
    searchResults.innerHTML = matches.length
      ? matches.map((m, i) => `
          <div class="search-result" data-sr="${i}">
            <div class="search-result__type">${esc(m.it.type)}</div>
            <div class="search-result__title">${esc(m.it.title)}</div>
            <div class="search-result__snippet">${esc(m.it.snippet)}</div>
          </div>`).join('')
      : '<div class="empty-state">Sin resultados.</div>';
    searchResults.querySelectorAll('[data-sr]').forEach(n => {
      n.addEventListener('click', () => {
        const m = matches[Number(n.dataset.sr)];
        searchOverlay.classList.remove('is-open');
        m.it.action();
      });
    });
  });

  // ------------------------------------------------------
  // 8. ARRANQUE
  // ------------------------------------------------------
  showPage('home');

})();
</script>
