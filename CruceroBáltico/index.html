dad.","hours":"24 h","price":"Gratis","tips":"Punto de encuentro habitual. Por las mañanas hay menos gente para fotos. El agua se quita en invierno.","gmaps_url":"https://www.google.com/maps/@54.3489,18.654,17z?q=Fuente%20de%20Neptuno","verified_at":"2026-05-15"},{"id":"gdansk-zuraw","name":"Żuraw (Grúa Medieval)","coords":{"lat":54.3505,"lng":18.6577},"review":"Grúa portuaria construida en 1442–1444, parte de las defensas medievales de la ciudad. Podía elevar 4 toneladas a 27 metros gracias a dos enormes ruedas accionadas por hombres caminando dentro como en una jaula de hámster. Es la grúa portuaria medieval más grande de Europa. Aunque la estructura externa de madera y ladrillo es reconstrucción de 1959 (la original fue destruida en 1945), las ruedas internas son originales del siglo XV.","hours":"Visita interior: 10:00–17:00 ma-do","price":"Exterior gratis. Visita museo: 20 PLN (4,75 €)","tips":"Lo mejor es la vista de la grúa desde la orilla opuesta del Motława (cruzar el puente peatonal). La visita interior es interesante pero corta (20 min).","gmaps_url":"https://www.google.com/maps/@54.3505,18.6577,17z?q=%C5%BBuraw%20%28Gr%C3%BAa%20Medieval%29","verified_at":"2026-05-15"},{"id":"gdansk-mariacka","name":"Basílica de Santa María","coords":{"lat":54.3502,"lng":18.6536},"review":"La 'Iglesia Roja de Gdansk' es la iglesia gótica de ladrillo más grande del mundo (algunos rivales escandinavos disputan el título pero los datos están a favor de Gdansk: 105 m de largo, 66 m de ancho, capacidad 25.000 personas). Su construcción se prolongó casi 200 años (1343–1502). Por dentro destaca la blancura de los muros enjalbegados, el reloj astronómico de 1470 que indica el zodíaco y las fases lunares, y la copia del Juicio Final de Hans Memling (el original está en el Museo Nacional).","hours":"Lu-sá 09:00–18:00, do 13:00–18:00","price":"Iglesia: 4 PLN. Torre: 20 PLN","tips":"La torre vale los 409 escalones. Vistas que llegan a Sopot. Si sois claustrofóbicos las escaleras son estrechas. Llevar agua.","gmaps_url":"https://www.google.com/maps/@54.3502,18.6536,17z?q=Bas%C3%ADlica%20de%20Santa%20Mar%C3%ADa","verified_at":"2026-05-15"},{"id":"gdansk-ulica-mariacka","name":"Ulica Mariacka","coords":{"lat":54.3502,"lng":18.6555},"review":"Probablemente la calle más fotogénica de Polonia: cada casa de mercaderes tiene un 'przedproże', una terracita elevada con escalinata frontal con gárgolas decorativas y barandillas de hierro forjado. La calle conecta la basílica de Santa María con el muelle del Motława. Hoy alberga las mejores tiendas de ámbar báltico de Gdansk (el ámbar es la 'piedra' de la ciudad: el 80 % del ámbar del mundo viene de esta costa).","hours":"Acceso libre 24 h","price":"Gratis","tips":"Comprad ámbar aquí, no en Mariacka. Pedid certificado de autenticidad. Joyas: collares 50–200 PLN, broches 80–300 PLN.","gmaps_url":"https://www.google.com/maps/@54.3502,18.6555,17z?q=Ulica%20Mariacka","verified_at":"2026-05-15"}],"restaurants":[{"name":"Pierogarnia Mandu","meal":"almuerzo","speciality":"Pierogi (empanadillas polacas) caseros con 40 rellenos diferentes","price_range":"€€","reservation_required":false,"notes":"Calle Elżbietańska 4, a 8 min andando de Mariacka. Pierogi al ruski (queso y patata), con carne, con setas. 30–45 PLN por plato.","gmaps_url":"https://www.google.com/maps/search/Pierogarnia+Mandu+Gdansk/@54.3502,18.6514,16z"}],"alternative_plans":{"more_time":"Si tenéis tiempo libre, visitad el Museo Europeo de Solidaridad (Europejskie Centrum Solidarności): historia del sindicato de Lech Wałęsa y la caída del comunismo. A 20 min andando del centro. Cierra a las 18:00. Entrada: 30 PLN (7 €).","less_time":"Si la ventana del barco se acorta, limitarse a Calle Larga + Plaza del Mercado + paseo por Motława + comer. Sin Basílica ni Mariacka.","rainy_day":"Refugiarse en el Museo Marítimo Nacional (Narodowe Muzeum Morskie), justo al cruzar el río Motława. Excelente museo y os mantiene secos. Entrada combinada 40 PLN."},"logistics":{"driving_km":25,"driving_time_min":35,"walking_km":5,"walking_time_min":60,"public_transport":"Francuskie Pier → Gdynia Główna: taxi 16–25 PLN, 10 min. SKM Gdynia Główna → Gdansk Główny: 5,50 PLN, 35 min, cada 15 min. Gdansk Główny → casco viejo: 10 min andando."},"info":{"travel_tips":["Polonia NO está en la zona euro: la moneda es el zloty (PLN). 1 EUR ≈ 4,30 PLN. Cambiar en kantor (casas de cambio) si necesitáis efectivo; mejor evitar las del aeropuerto/estación. Las tarjetas se aceptan en casi todas partes.","Validad SIEMPRE los billetes del SKM (tren urbano) antes de subir: hay multas de 270 PLN si os controlan sin validar.","El ámbar es una excelente compra en Gdansk: piedras translúcidas amarillas/rojizas/marrones. Comprad en tiendas certificadas (Mariacka), no en puestos callejeros (a menudo es plástico)."],"access":["El puerto de Gdynia está conectado con Gdansk por el SKM (Szybka Kolej Miejska): tren cercanías cada 15 min.","El casco antiguo de Gdansk es 100% peatonal: olvidaos del transporte una vez dentro."],"facts":["El 1 de septiembre de 1939 los cañones del acorazado alemán Schleswig-Holstein bombardearon el fuerte polaco de Westerplatte en Gdansk: el primer disparo de la Segunda Guerra Mundial.","El 80 % del ámbar del mundo viene del Báltico, donde se encuentra fosilizado en arenas costeras de Gdansk a Kaliningrado.","La 'Ciudad Libre de Danzig' (1920–1939) era una ciudad-estado bajo la Sociedad de Naciones. Su anexión por Hitler fue el detonante de la guerra."]}},{"day":5,"date":"2026-09-15","title":"Klaipėda: ámbar lituano y arquitectura prusiana","hero_image":"","timeline":[{"time":"07:00","icon":"⚓","title":"Atraque en Klaipėda","description":"El barco amarra en pleno centro: la terminal de cruceros está en la desembocadura del río Danė, a 5 min andando del casco viejo. Es uno de los puertos más cómodos del Báltico. Ventana corta: 07:00–15:00 (8 h).","type":"checkin","duration_min":60},{"time":"08:30","icon":"🚶","title":"Salida hacia el casco antiguo","description":"Cruzar el puente peatonal sobre el Danė y entrar en la Senamiestis (ciudad vieja). La planta urbana es una cuadrícula rectangular: muy poco habitual en Europa y herencia de la planificación prusiana del siglo XVIII (Klaipėda se llamaba Memel y era parte de Prusia Oriental).","type":"transport","duration_min":10},{"time":"08:45","icon":"🎭","title":"Teatro Dramático y plaza","description":"Plaza Teatro (Teatro aikštė), antigua plaza del mercado. En el centro, la fuente de Anchen von Tharau, dedicada al poeta alemán Simon Dach. Frente, el Teatro Dramático en una elegante fachada neoclásica. Es donde Hitler dio uno de sus famosos discursos en 1939 anunciando la anexión de Memel al Reich.","type":"visit","duration_min":30},{"time":"09:15","icon":"🐭","title":"Esculturas urbanas de Klaipėda","description":"Klaipėda es famosa por sus pequeñas esculturas de bronce escondidas por el casco viejo: el Ratón Mágico (susurrar un deseo a su oreja), el Gato con Cara de Caballero, el Dragón, el Deshollinador en un tejado, el Fantasma Negro en el muelle del río. Las localizaciones están señaladas en mapas turísticos gratuitos en la oficina del puerto.","type":"visit","duration_min":60},{"time":"10:15","icon":"🚢","title":"Ferry al Spit de Curlandia","description":"Desde el Old Ferry Terminal (10 min andando del barco), ferry peatonal cruza al spit de Curlandia (Patrimonio UNESCO): un cordón litoral de 98 km con dunas, pinares y aldeas de pescadores. Ferry: 1,30 € adulto, cada 30 min. En la otra orilla está Smiltynė, donde está el Acuario de Lituania y el comienzo de los senderos hacia las dunas.","type":"transport","duration_min":15},{"time":"10:30","icon":"🏖️","title":"Smiltynė y paseo por las dunas","description":"Pasear por el bosque de pino marítimo hasta la cresta de las dunas. La playa principal del lado báltico está a 15 min andando del ferry. En septiembre el agua del Báltico está sobre los 16°C: no apetece bañarse pero la arena blanca es espectacular. Caminar hasta el Acuario de Lituania (opcional, 8 €) y volver.","type":"visit","duration_min":90},{"time":"12:00","icon":"🚢","title":"Vuelta en ferry a Klaipėda","description":"Ferry de regreso. 5 min de trayecto. En la terminal compraréis el billete de vuelta si no habéis sacado ida-vuelta antes.","type":"transport","duration_min":15},{"time":"12:15","icon":"🍴","title":"Almuerzo en el casco viejo","description":"Recomendamos Cili Kaimas (cocina lituana tradicional: cepelinai —dumpling de patata con carne—, blynai —tortitas— y kepta duona —pan de centeno frito con ajo—). 8–15 € por persona. Es una cadena pero con plato lituano auténtico.","type":"meal","duration_min":60},{"time":"13:15","icon":"🏛️","title":"Museo del Reloj","description":"Una pequeña joya en el casco viejo de Klaipėda: el Museo del Reloj y de la Hora reúne piezas de medición del tiempo desde sundials primitivos hasta autómatas barrocos. Pequeño pero educativo (45 min) y refugio si llueve.","type":"visit","duration_min":45},{"time":"14:00","icon":"🚶","title":"Regreso al barco","description":"Andar 5 min al muelle de cruceros. Llegar al barco con margen de 30 min mínimo.","type":"transport","duration_min":10},{"time":"15:00","icon":"⚓","title":"Salida hacia Riga","description":"Zarpamos rumbo norte por el golfo de Riga.","type":"transport","duration_min":0}],"places":[{"id":"klaipeda-teatro","name":"Plaza Teatro y Annchen von Tharau","coords":{"lat":55.7078,"lng":21.1316},"review":"El corazón de Klaipėda: plaza presidida por el Teatro Dramático (1857) en estilo neoclásico, con frontón triangular. En el centro, la fuente con la estatua de Annchen von Tharau, dedicada al poeta alemán Simon Dach que vivió aquí cuando la ciudad se llamaba Memel. La estatua original fue destruida en la Segunda Guerra Mundial; la actual es una réplica de 1989.","hours":"Acceso libre 24 h","price":"Gratis","tips":"Aquí Hitler pronunció un discurso el 23 de marzo de 1939 desde el balcón del teatro anunciando la anexión de Memelland al Reich. Una de las últimas anexiones pacíficas de Hitler antes de la guerra.","gmaps_url":"https://www.google.com/maps/@55.7078,21.1316,17z?q=Plaza%20Teatro%20y%20Annchen%20von%20Tharau","verified_at":"2026-05-15"},{"id":"klaipeda-raton-magico","name":"Ratón Mágico (Magiškas pelytė)","coords":{"lat":55.7088,"lng":21.1325},"review":"Escultura de bronce minúscula (12 cm) en Kalvių gatvė, junto a la plaza del Teatro. Inaugurada en 2014, se ha convertido en mascota turística. La leyenda dice que susurrarle un deseo al oído lo convierte en realidad. Hay varias esculturas escondidas por la ciudad (gato, dragón, fantasma negro junto al río), buscadlas con un mapa de turismo.","hours":"24 h","price":"Gratis","tips":"Está pequeñita: fácil de pasarla por alto. Conviene tener el mapa de esculturas que dan gratis en la oficina de turismo del puerto.","gmaps_url":"https://www.google.com/maps/@55.7088,21.1325,17z?q=Rat%C3%B3n%20M%C3%A1gico%20%28Magi%C5%A1kas%20pelyt%C4%97%29","verified_at":"2026-05-15"},{"id":"klaipeda-smiltyne","name":"Spit de Curlandia (Smiltynė)","coords":{"lat":55.7102,"lng":21.1167},"review":"Lengua de arena de 98 km que separa el mar Báltico del lago de Curlandia. Compartida entre Lituania (la mitad norte, accesible desde Klaipėda) y Rusia (mitad sur, Kaliningrado). UNESCO Patrimonio Natural por sus dunas migrantes y pinares centenarios. Smiltynė es la zona más cercana al ferry de Klaipėda: bosque de pinos, senderos señalizados, playa amplia y el Acuario de Lituania.","hours":"Acceso libre. Ferry cada 30 min de 06:00 a 22:00","price":"Ferry: 1,30 € adulto/trayecto","tips":"Para ver las dunas espectaculares (Nida, Parnidis) habría que ir 50 km al sur en bus: imposible con esta ventana corta. En Smiltynė se ve el paisaje en pequeño.","gmaps_url":"https://www.google.com/maps/@55.7102,21.1167,17z?q=Spit%20de%20Curlandia%20%28Smiltyn%C4%97%29","verified_at":"2026-05-15"},{"id":"klaipeda-museo-reloj","name":"Museo del Reloj de Klaipėda","coords":{"lat":55.7117,"lng":21.1311},"review":"Pequeño museo que cuenta la historia de la medición del tiempo: relojes solares, de agua, de arena, mecánicos del Renacimiento, ingenios autómatas barrocos, piezas curiosas como un cronómetro náutico inglés del XIX. Ocupa un edificio histórico del barrio antiguo. Visita rápida pero entretenida y educativa. Cada hora hay una pequeña representación con el reloj musical.","hours":"Ma-sá 12:00–18:00, do 12:00–17:00. Cerrado lunes","price":"5 € adulto","tips":"Visita cómoda en 45 min. Aire acondicionado. Ideal si llueve o se hace pesado el sol del puerto.","gmaps_url":"https://www.google.com/maps/@55.7117,21.1311,17z?q=Museo%20del%20Reloj%20de%20Klaip%C4%97da","verified_at":"2026-05-15"}],"restaurants":[{"name":"Čili Kaimas Klaipėda","meal":"almuerzo","speciality":"Cepelinai (zepelines de patata rellenos de carne) y blynai (tortitas)","price_range":"€€","reservation_required":false,"notes":"Cadena nacional pero con cocina tradicional lituana correcta. Tilžės g. 2, en pleno casco viejo. Menús de mediodía sobre 10–12 €. Cerveza Švyturys local muy buena.","gmaps_url":"https://www.google.com/maps/search/Čili+Kaimas+Klaipeda/@55.7078,21.1316,16z"}],"alternative_plans":{"more_time":"Si el barco saliera más tarde, Smiltynė da para 3 h: visitar también el Museo Marítimo de Lituania y la Vieja Aldea de Pescadores reconstruida. Si tenéis fuerza, en Klaipėda hay un castillo subterráneo (Castillo de Memelburg) bajo el casco antiguo, parcialmente excavado.","less_time":"Si os dais cuenta de que la ventana es muy ajustada, omitir Smiltynė y limitarse al casco antiguo de Klaipėda: 3 h de caminata cómoda viendo Plaza Teatro, esculturas, Calle Vežėjų y muelle del Danė.","rainy_day":"Con lluvia, ignorar Smiltynė: el ferry es a la intemperie y la playa pierde mucho. Quedarse en Klaipėda con Museo del Reloj + comer + Museo de Historia de Prusia Oriental (5 €)."},"logistics":{"driving_km":0,"driving_time_min":0,"walking_km":3,"walking_time_min":45,"public_transport":"Ferry peatonal Old Ferry Terminal → Smiltynė: 1,30 € adulto, cada 30 min, 5 min de trayecto. Toda la ciudad antigua es peatonal y caminable."},"info":{"travel_tips":["Lituania está en la zona euro desde 2015: pagáis en EUR, sin conversión. ¡El conversor del visor no os hará falta aquí!","El lituano es lengua única (familia báltica, junto al letón, las más antiguas indoeuropeas vivas). El inglés se habla mejor entre jóvenes; entre mayores, ruso o alemán es habitual.","Klaipėda se llamó Memel hasta 1923: era parte de Prusia Oriental alemana. La cuadrícula urbana y los edificios bajos de ladrillo testimonian ese pasado prusiano."],"access":["El muelle de cruceros está PEGADO al casco antiguo: 5 minutos andando cruzando el puente sobre el río Danė.","Para el spit de Curlandia: ferry desde el Old Ferry Terminal (Senoji perkėla), 10 min a pie del muelle de cruceros."],"facts":["Klaipėda es el único puerto marítimo de Lituania (el país tiene apenas 90 km de costa).","El nombre 'Memel' viene del río Niemen/Nemunas, que desemboca aquí.","Tras la Primera Guerra Mundial, Memel fue cedida a Francia y luego anexada por Lituania en 1923. Hitler la recuperó en 1939, los soviéticos en 1945, y Lituania la recuperó al independizarse en 1991."]}},{"day":6,"date":"2026-09-16","title":"Riga: gótico báltico y la mayor colección Art Nouveau de Europa","hero_image":"","timeline":[{"time":"07:00","icon":"⚓","title":"Atraque en Riga","description":"El barco amarra en la terminal de cruceros del Daugava, a 10 min andando del casco antiguo. Ventana corta: 07:00–15:00 (8 h). Riga es una visita densa de Patrimonio UNESCO (casco antiguo + distrito Art Nouveau).","type":"checkin","duration_min":60},{"time":"08:30","icon":"🚶","title":"Salida hacia el casco viejo (Vecrīga)","description":"Andar 10 min siguiendo el río Daugava hacia el sur. Se llega al Castillo de Riga (residencia presidencial) y a la Casa de Cabezas Negras.","type":"transport","duration_name":10},{"time":"08:45","icon":"🏛️","title":"Plaza del Ayuntamiento y Casa de las Cabezas Negras","description":"La Casa de las Cabezas Negras (Melngalvju nams) es la postal de Riga: una fachada manierista del XV reconstruida completamente en 1999 sobre los cimientos originales destruidos en la guerra. Era la sede del gremio de mercaderes solteros. Frente, la plaza con el Ayuntamiento y la estatua de Roland (patrón de las libertades urbanas hanseáticas).","type":"visit","duration_min":30},{"time":"09:15","icon":"⛪","title":"Catedral de Riga (Doma baznīca)","description":"La iglesia más grande de los Estados Bálticos, construida desde 1211 y reformada hasta el XVIII. Estilos mezclados: románico (interior), gótico de ladrillo (nave) y barroco (torre). Su órgano de 1884 con 6.768 tubos es uno de los más grandes del mundo y aún en uso. Conciertos diarios al mediodía.","type":"visit","duration_min":45},{"time":"10:00","icon":"🌀","title":"Iglesia de San Pedro y mirador","description":"Iglesia gótica del siglo XIII con una torre de 123 m (la 4ª iglesia más alta del Báltico). Ascensor sube al mirador a 72 m: vistas espectaculares sobre los tejados de tejas rojas y el Daugava. Entrada 9 € adulto.","type":"visit","duration_min":60},{"time":"11:00","icon":"🏘️","title":"Las Tres Hermanas (Trīs brāļi)","description":"Las tres casas medievales más antiguas de Riga, una al lado de otra en la calle Mazā Pils. La 'hermana mayor' (nº 17, blanca) es del siglo XV. Cada una con su personalidad: la del medio amarilla, la pequeña verde. Equivalente a las Tres Hermanas de Tallin pero más antiguas. Visita exterior, son oficinas hoy.","type":"visit","duration_min":20},{"time":"11:20","icon":"🚶","title":"Camino al Distrito Art Nouveau","description":"Andar 15 min al norte cruzando el parque urbano de Bastejkalns (Colina del Bastión) y pasando junto al Monumento a la Libertad (1935), símbolo nacional letón. Llegamos al barrio centro-norte, conocido como 'la Citadella' o Mežaparks Boulevard.","type":"transport","duration_min":20},{"time":"11:40","icon":"🏛️","title":"Alberta iela: la calle del Art Nouveau","description":"El distrito Art Nouveau de Riga es el mayor del mundo: 800 edificios. La calle Alberta iela concentra los mejores: edificios proyectados por Mikhail Eisenstein (padre del cineasta Sergei) entre 1899 y 1906. Fachadas decoradas con esfinges, leones rugientes, cariátides, máscaras grotescas. En el nº 12 está el Museo Art Nouveau de Riga (8 €, recomendado).","type":"visit","duration_min":75},{"time":"12:55","icon":"🍴","title":"Almuerzo: Folkklubs ALA Pagrabs","description":"Restaurante folclórico letón en el casco viejo (vuelta andando: 15 min, o tranvía). Sirven cocina tradicional báltica: sopa de remolacha aukstā zupa, carbonada de cerdo, gris (potaje de avena gris característico del país). 15–22 € por persona. Cerveza artesanal letona excelente.","type":"meal","duration_min":60},{"time":"13:55","icon":"🚶","title":"Regreso al barco","description":"Andar tranquilamente al muelle. Si os habéis quedado en el Art Nouveau, coger un Bolt o taxi (5–7 €).","type":"transport","duration_min":30},{"time":"14:30","icon":"🚢","title":"Embarque","description":"Embarque y descanso a bordo.","type":"checkin","duration_min":30},{"time":"15:00","icon":"⚓","title":"Salida hacia Tallin","description":"Zarpamos rumbo norte por el golfo de Riga.","type":"transport","duration_min":0}],"places":[{"id":"riga-cabezas-negras","name":"Casa de las Cabezas Negras (Melngalvju nams)","coords":{"lat":56.9472,"lng":24.1064},"review":"Sede del gremio de mercaderes solteros (la 'Hermandad de Cabezas Negras', llamada así por su patrón San Mauricio, mártir nubio del siglo III). El edificio original era del 1334 y se decoró progresivamente con una fachada manierista holandesa hasta el XVII. Destruido por los bombardeos alemanes en 1941 y demolido por los soviéticos en 1948, fue reconstruido en 1995–1999 con motivo del 800 aniversario de la ciudad. La fachada actual es una reconstrucción minuciosa: cariátides, frisos, reloj solar, escudos heráldicos.","hours":"Plaza 24 h. Interior museo: 10:00–18:00","price":"Plaza gratis. Interior museo: 7 €","tips":"La fachada se ilumina al anochecer. La visita interior solo merece la pena si os interesa la historia del gremio: dura 45 min con salas reconstruidas.","gmaps_url":"https://www.google.com/maps/@56.9472,24.1064,17z?q=Casa%20de%20las%20Cabezas%20Negras%20%28Melngalvju%20nams%29","verified_at":"2026-05-15"},{"id":"riga-domkirche","name":"Catedral de Riga (Doma baznīca)","coords":{"lat":56.9497,"lng":24.1064},"review":"La iglesia más grande de los Estados Bálticos. Construida en 1211 por el obispo Alberto, fundador de Riga. La estructura combina románico tardío (transepto), gótico de ladrillo (nave) y la torre barroca actual de 1776 con cúpula bulbosa. El órgano de 1884 (firma alemana Walcker) tiene 6.768 tubos y fue, en su momento, el más grande del mundo. Hoy se considera uno de los mejores instrumentos románticos de Europa: Liszt y Bruckner soñaron con tocarlo. Conciertos diarios al mediodía (15 €).","hours":"Lu-sá 10:00–17:00, do 14:00–17:00","price":"5 € adulto. Concierto órgano: 15 €","tips":"El concierto de órgano del mediodía dura 20 min y es una experiencia única: música sacra reverberando en el espacio gótico. Reservar online si vais en temporada alta.","gmaps_url":"https://www.google.com/maps/@56.9497,24.1064,17z?q=Catedral%20de%20Riga%20%28Doma%20bazn%C4%ABca%29","verified_at":"2026-05-15"},{"id":"riga-san-pedro","name":"Iglesia de San Pedro (Sv. Pētera baznīca)","coords":{"lat":56.9476,"lng":24.1097},"review":"Iglesia luterana gótica del XIII con una torre que fue, durante el siglo XVIII, la torre de madera más alta del mundo (123 m). Destruida en 1941 por incendio durante el bombardeo alemán y reconstruida en hormigón armado por los soviéticos en 1973 manteniendo silueta original. El ascensor sube al mirador a 72 m de altura: la mejor panorámica de Riga, con el Daugava, el casco viejo de tejados rojos y el distrito Art Nouveau al norte.","hours":"Ma-vi 10:00–18:00, sá-do 10:00–19:00","price":"Iglesia + torre: 9 € adulto","tips":"Subid en cualquier momento: cola breve. Las vistas son de 360°. Si tenéis poco tiempo, el mirador de la Iglesia de San Pedro es prioritario sobre la torre de la Catedral.","gmaps_url":"https://www.google.com/maps/@56.9476,24.1097,17z?q=Iglesia%20de%20San%20Pedro%20%28Sv.%20P%C4%93tera%20bazn%C4%ABca%29","verified_at":"2026-05-15"},{"id":"riga-tres-hermanas","name":"Las Tres Hermanas (Trīs brāļi)","coords":{"lat":56.9509,"lng":24.1054},"review":"Conjunto residencial medieval único: tres casas burguesas pegadas en la calle Mazā Pils. La hermana mayor (nº 17, fachada blanca de ladrillo a la vista) es del siglo XV y la casa de vivienda más antigua de Riga; la mediana (nº 19, fachada amarilla) del XVII; la pequeña (nº 21, verde) del XVII también. Conservan los rasgos típicos de la casa hanseática burguesa: zaguán para descarga de mercancías, primer piso de almacenamiento, segundo de habitación. Hoy oficinas del Museo de Arquitectura Letona.","hours":"Exterior 24 h. Museo: lu-vi 09:00–16:00","price":"Exterior gratis","tips":"Una de las imágenes más reconocibles de Riga. Posad para la foto desde el otro lado de la calle.","gmaps_url":"https://www.google.com/maps/@56.9509,24.1054,17z?q=Las%20Tres%20Hermanas%20%28Tr%C4%ABs%20br%C4%81%C4%BCi%29","verified_at":"2026-05-15"},{"id":"riga-alberta-iela","name":"Alberta iela (calle Art Nouveau)","coords":{"lat":56.9586,"lng":24.1078},"review":"Riga tiene más de 800 edificios Art Nouveau, el mayor conjunto del mundo. Alberta iela concentra los mejores: una calle entera proyectada principalmente por Mikhail Eisenstein (padre del director soviético Sergei Eisenstein) entre 1901 y 1906. Las fachadas estallan con esfinges aladas, leones rugientes, cariátides, máscaras grotescas, motivos vegetales y geométricos. Los números 2, 2a, 4, 6 y 8 son obras maestras. En el nº 12 está el Museo del Art Nouveau de Riga, ambientado como vivienda burguesa de 1903 (entrada 9 €).","hours":"Calle 24 h. Museo: ma-do 10:00–18:00","price":"Calle gratis. Museo: 9 €","tips":"Llevad cámara y mucha paciencia para fotografiar fachada por fachada. La luz de la mañana (este) es óptima.","gmaps_url":"https://www.google.com/maps/@56.9586,24.1078,17z?q=Alberta%20iela%20%28calle%20Art%20Nouveau%29","verified_at":"2026-05-15"}],"restaurants":[{"name":"Folkklubs ALA Pagrabs","meal":"almuerzo","speciality":"Cocina tradicional letona: aukstā zupa (sopa fría de remolacha), pīrāgi (empanadillas de tocino), carbonada de cerdo","price_range":"€€","reservation_required":false,"notes":"Sótano de un edificio del XVIII en la calle Pēterbaznīcas 4, junto a la iglesia de San Pedro. Decoración con utensilios rurales, música folk en directo algunas noches. Cerveza artesanal letona (Brālis, Valmiermuiža). 15–22 € por persona.","gmaps_url":"https://www.google.com/maps/search/Folkklubs+ALA+Pagrabs+Riga/@56.9476,24.1097,16z"}],"alternative_plans":{"more_time":"Si hubiese más tiempo (no en esta ventana), añadir el Mercado Central de Riga: instalado en cinco pabellones que fueron hangares Zeppelin reciclados. Productos del campo letón. Atmósfera de 1920.","less_time":"Si la ventana fuera todavía más corta, sacrificar Art Nouveau y limitarse al casco antiguo: Cabezas Negras + Catedral + San Pedro + Tres Hermanas en 3 h.","rainy_day":"El plan resiste bien la lluvia: tres iglesias y un museo. Sustituir Alberta iela por Latvian National Museum of Art (8 €), cubierto y excelente."},"logistics":{"driving_km":0,"driving_time_min":0,"walking_km":4,"walking_time_min":60,"public_transport":"Casco antiguo todo peatonal. Para Art Nouveau: andando 15 min desde el casco viejo, o tranvía 11 desde Akmens tilts hasta Pulkveža Brieža (3 paradas). Billete: 2 € en máquina."},"info":{"travel_tips":["Letonia está en la zona euro desde 2014: pagáis en EUR, sin cambio. El conversor del visor no aplica aquí.","El letón es lengua única (familia báltica). El inglés se habla razonablemente entre menores de 40. Entre mayores, ruso (un cuarto de la población son rusoparlantes).","Riga tiene mucho mendigo profesional en zonas turísticas (Cabezas Negras, San Pedro): ignorar."],"access":["Puerto de Riga → casco antiguo: 10 min andando siguiendo el río al sur. Es paseo agradable, no hace falta taxi.","Para el distrito Art Nouveau: 15 min andando del casco viejo cruzando el parque Bastejkalns."],"facts":["Riga fue fundada en 1201 por el obispo alemán Alberto: el origen mismo es comercial.","El órgano de la Catedral de Riga inspiró a Wagner: estuvo aquí como Kapellmeister entre 1837 y 1839, dirigiendo la ópera de Riga.","El padre de Sergei Eisenstein (director de El acorazado Potemkin) era el arquitecto que proyectó la mayoría de los edificios de Alberta iela."]}},{"day":7,"date":"2026-09-17","title":"Tallin: la ciudad medieval mejor conservada del Báltico","hero_image":"","timeline":[{"time":"09:00","icon":"⚓","title":"Atraque en Tallin","description":"El barco amarra en el puerto antiguo (Vanasadam), a 1 km del casco viejo. Excelente: puerto céntrico, casco amurallado caminable, ventana amplia (09:00–18:00, 9 h). Tallin permite una jornada completa.","type":"checkin","duration_min":30},{"time":"09:30","icon":"🚶","title":"Andando al casco antiguo","description":"Salir del muelle siguiendo la señalización a 'Old Town'. 15–20 min andando suave. Se entra por la Torre Margarita la Gorda (Paks Margareeta), la única torre de cañón medieval que conserva el casco antiguo.","type":"transport","duration_min":20},{"time":"09:50","icon":"🏰","title":"Pikk Tänav y casa de las Cabezas Negras","description":"La calle Pikk ('larga') es la arteria comercial del casco antiguo: casas burguesas hanseáticas, gremios de mercaderes, salones de baile. Pasaremos junto a la Casa de las Cabezas Negras de Tallin (nº 26), la Casa del Gran Gremio (nº 17, hoy Museo de Historia) y la Iglesia de San Olaf, cuya aguja de 124 m fue, brevemente entre 1549 y 1625, la torre más alta del mundo.","type":"visit","duration_min":45},{"time":"10:35","icon":"⛪","title":"Iglesia del Espíritu Santo (Pühavaimu)","description":"Pequeña iglesia gótica de 1316, una de las más antiguas del Báltico. Fachada blanca con un reloj de pared de 1684 (el más antiguo de Estonia, todavía funcional). Por dentro, un retablo medieval de roble pintado por Bernt Notke (1483) y bancos numerados aún con escudos heráldicos de gremios.","type":"visit","duration_min":30},{"time":"11:05","icon":"🏛️","title":"Plaza del Ayuntamiento (Raekoja plats)","description":"El corazón de Tallin: una plaza medieval triangular dominada por el Ayuntamiento gótico (Raekoda) de 1404, el más antiguo del norte de Europa que sigue en uso como ayuntamiento. La aguja con el viejo Thomas (veleta de soldado de 1530) es el símbolo de la ciudad. En la plaza, la farmacia Raeapteek (1422) es una de las más antiguas de Europa: aún se venden medicinas. Conservan recetas medievales en vitrinas.","type":"visit","duration_min":60},{"time":"12:05","icon":"⛰️","title":"Subida a Toompea (ciudad alta)","description":"El casco antiguo de Tallin se divide en dos niveles: la ciudad baja (mercaderes) y la ciudad alta sobre la colina de Toompea (clero y nobleza). Subir por la cuesta Pikk Jalg ('pierna larga'). 5 min de subida cómoda.","type":"transport","duration_min":10},{"time":"12:15","icon":"🕌","title":"Catedral Alexander Nevsky","description":"Catedral ortodoxa rusa de 1900, inaugurada deliberadamente sobre Toompea durante la rusificación zarista como símbolo del poder ruso sobre los estonios. Cinco cúpulas bulbosas de cobre verde, fachada de granito rosa y mosaicos dorados. Cuando Estonia se independizó en 1918 se discutió demolerla; al final se conservó. Cabe destacar la decoración interior bizantina.","type":"visit","duration_min":30},{"time":"12:45","icon":"🏰","title":"Castillo de Toompea y miradores","description":"El castillo medieval (hoy Parlamento estonio, edificio rosa) ocupa el extremo sur de la colina. La fachada actual es del XVIII pero conserva la Pikk Hermann ('Hermann el Largo'), torre medieval del XIV donde ondea la bandera nacional (cada amanecer se sube al son del himno). Los miradores Patkuli y Kohtuotsa ofrecen las mejores vistas sobre el casco bajo de tejados rojos.","type":"visit","duration_min":45},{"time":"13:30","icon":"🍴","title":"Almuerzo en Rataskaevu","description":"Bajada al casco viejo, almuerzo en Rataskaevu 16: cocina estonia moderna a precio razonable. Sopa de carne de alce con setas, salmón báltico ahumado, postre de pan de centeno con miel. 20–28 € por persona. Reservar online si es posible.","type":"meal","duration_min":75},{"time":"14:45","icon":"🏘️","title":"Telliskivi Creative City (opcional)","description":"Si queréis ver una cara diferente de Tallin, cruzad las vías del tren al norte y entrad en Telliskivi: antigua fábrica soviética reconvertida en centro de start-ups, galerías, food trucks y cervecerías artesanas. Es el lado moderno y diseño de la ciudad. 10 min andando del casco viejo.","type":"visit","duration_min":90},{"time":"16:15","icon":"🚶","title":"Camino de regreso al barco","description":"Volver al muelle del puerto Vanasadam atravesando el casco viejo. 20 min andando con calma.","type":"transport","duration_min":25},{"time":"17:00","icon":"🚢","title":"Embarque","description":"Embarque tranquilo y descanso a bordo.","type":"checkin","duration_min":30},{"time":"18:00","icon":"⚓","title":"Salida hacia Helsinki","description":"Zarpamos cruzando el golfo de Finlandia. Es la travesía más corta del viaje: 85 km, 8–10 h, durmiendo.","type":"transport","duration_min":0}],"places":[{"id":"tallin-raekoja","name":"Plaza del Ayuntamiento (Raekoja plats)","coords":{"lat":59.4371,"lng":24.7456},"review":"Plaza medieval triangular dominada por el Ayuntamiento gótico de Tallin (1402–1404), el más antiguo del norte de Europa que sigue siendo sede ayuntamiento. La aguja del campanario lleva la veleta del 'Viejo Thomas' (Vana Toomas), figura de soldado de 1530 que es el símbolo de la ciudad. La planta de la plaza conserva la pavimentación medieval. Los edificios laterales: la Farmacia del Ayuntamiento (Raeapteek, 1422, una de las más antiguas de Europa todavía abierta), la antigua escuela latina y casas burguesas. En Navidad acoge el mercado más bonito del Báltico.","hours":"Plaza 24 h. Ayuntamiento: lu-sá 10:00–17:00 jun-ago. Raeapteek: lu-vi 09:00–18:00.","price":"Plaza gratis. Subida torre Ayuntamiento: 6 €. Raeapteek: gratis","tips":"Entrad en la Raeapteek aunque no compréis nada: hay un pequeño museo gratuito al fondo con recetas medievales en vitrinas. Probadlo el marsipa (pasta de almendras), invento medieval de Tallin.","gmaps_url":"https://www.google.com/maps/@59.4371,24.7456,17z?q=Plaza%20del%20Ayuntamiento%20%28Raekoja%20plats%29","verified_at":"2026-05-15"},{"id":"tallin-alexander-nevsky","name":"Catedral Alexander Nevsky","coords":{"lat":59.436,"lng":24.74},"review":"Catedral ortodoxa rusa construida entre 1894 y 1900 sobre la colina de Toompea, deliberadamente colocada en el punto más visible del paisaje estonio como símbolo de la rusificación impuesta por el zar Alejandro III. Cinco cúpulas bulbosas de cobre que se han ido oxidando al verde característico, fachada de granito rosa, mosaicos dorados de gran calidad. La iglesia tiene una de las campanas más grandes de Estonia (15 toneladas). El interior es bizantino con iconostasio dorado. Cuando Estonia se independizó en 1918 hubo debates sobre demolerla; al final se conservó.","hours":"Diario 08:00–19:00","price":"Gratis (donativos)","tips":"Mujeres deben cubrirse la cabeza (hay pañuelos a la entrada); hombros y rodillas cubiertos. Silencio absoluto dentro. No se permiten fotos en el interior.","gmaps_url":"https://www.google.com/maps/@59.436,24.74,17z?q=Catedral%20Alexander%20Nevsky","verified_at":"2026-05-15"},{"id":"tallin-toompea-mirador","name":"Mirador Kohtuotsa (Toompea)","coords":{"lat":59.4395,"lng":24.744},"review":"La mejor plataforma para fotografía panorámica de Tallin: terraza con vista directa sobre los tejados rojos del casco antiguo, las torres de las murallas, las agujas de San Olaf y el ayuntamiento, y el mar Báltico al fondo. La famosa pintada 'The Times We Had' (recuerdo de un romance amargo, repintada periódicamente) está en el muro. Acceso libre, abierto 24 h. El segundo mirador en Toompea, Patkuli, está al norte y es bueno también pero con menos tomarse fotos.","hours":"24 h","price":"Gratis","tips":"Mejor luz: por la mañana temprano (sol del este). Llegará gente desde las 10. La luz del atardecer también es magnífica si el barco saliera más tarde.","gmaps_url":"https://www.google.com/maps/@59.4395,24.744,17z?q=Mirador%20Kohtuotsa%20%28Toompea%29","verified_at":"2026-05-15"},{"id":"tallin-pikk","name":"Calle Pikk (Calle Larga)","coords":{"lat":59.4395,"lng":24.7484},"review":"La arteria comercial del casco antiguo de Tallin desde el siglo XIV: 700 m que conectan la Torre Margarita la Gorda (acceso desde el puerto) con la Plaza del Ayuntamiento. A lo largo de la calle se concentran los edificios más relevantes: la Casa del Gran Gremio (1417, hoy Museo de Historia de Estonia), la Casa de las Cabezas Negras (Mustpeade maja, gremio de mercaderes solteros), el Salón Canuto (gremio de oficios) y la Iglesia de San Olaf con su aguja de 124 m (la torre más alta del mundo entre 1549 y 1625). Casi todas las casas conservan portales medievales con animales tallados.","hours":"24 h","price":"Gratis","tips":"Subir a la torre de San Olaf (5 €, 232 escalones) vale la pena solo si no habéis subido ya a otra torre del viaje. Vistas similares al mirador Kohtuotsa.","gmaps_url":"https://www.google.com/maps/@59.4395,24.7484,17z?q=Calle%20Pikk%20%28Calle%20Larga%29","verified_at":"2026-05-15"},{"id":"tallin-telliskivi","name":"Telliskivi Creative City","coords":{"lat":59.4404,"lng":24.7325},"review":"Antigua fábrica soviética de electrónica reconvertida desde 2009 en el barrio creativo más vibrante del Báltico: oficinas de start-ups, galerías de arte (Fotografiska Tallin abrió aquí en 2019), tiendas de diseño estonio (Reet Aus, hattu), food trucks, cervecerías artesanas y restaurantes hipsters. Los edificios industriales conservan grafitis monumentales que cambian cada temporada. Buen contrapunto al casco antiguo medieval y muestra del 'otro' Tallin: la república digital del siglo XXI (Estonia inventó la firma electrónica universal y el voto online).","hours":"Calle abierta 24 h. Tiendas y locales: 10:00–22:00 aprox.","price":"Gratis","tips":"Para comer rápido y casual: F-hoone (cantina, 12–15 €), Põhjala Brewery (cerveza artesanal con menú), o el food court de Balti Jaama Turg (mercado), a 5 min andando.","gmaps_url":"https://www.google.com/maps/@59.4404,24.7325,17z?q=Telliskivi%20Creative%20City","verified_at":"2026-05-15"}],"restaurants":[{"name":"Rataskaevu 16","meal":"almuerzo","speciality":"Carne de alce estofada, salmón báltico ahumado, sopa de setas silvestres","price_range":"€€€","reservation_required":true,"notes":"El restaurante más recomendado del casco antiguo de Tallin. Calle Rataskaevu 16. Reservar online (rataskaevu16.ee) con al menos 1 semana de antelación, sobre todo en temporada de cruceros. 25–35 € por persona.","gmaps_url":"https://www.google.com/maps/search/Rataskaevu+16+Tallinn/@59.437,24.7456,16z"}],"alternative_plans":{"more_time":"Si os interesa la historia reciente, visitad el Museo de las Ocupaciones y la Libertad (Vabamu): cuenta la ocupación nazi y soviética de Estonia 1940–1991. 11 €, 10 min andando del casco viejo. O bien el Lennusadam (Hidroaviones), museo marítimo en una colosal hangar de hidroaviones de 1916, también recomendable.","less_time":"Si la ventana se acortara, omitir Telliskivi y limitarse al casco antiguo (5 h): muralla, Pikk, Plaza del Ayuntamiento, Toompea y mirador. Tallin medieval es tan compacto que se hace cómodo en 4–5 h.","rainy_day":"El plan resiste bien la lluvia: callejear por casco antiguo con paraguas tiene su encanto. Como refugio prolongado: Museo Marítimo (Lennusadam, 16 €, 1,5 km del puerto), el mejor museo de Estonia. O el KGB Museum en el Hotel Viru, 11 €."},"logistics":{"driving_km":0,"driving_time_min":0,"walking_km":6,"walking_time_min":90,"public_transport":"Casco antiguo 100 % peatonal. Para llegar del puerto al casco: 15–20 min andando, o bus 2 hasta Mere puiestee (5 min). Para Telliskivi: 15 min andando o tranvía 1 o 2 desde Linnahall. Billetes de transporte: 2 € por trayecto, 4,50 € día."},"info":{"travel_tips":["Estonia está en la zona euro desde 2011. No hay que cambiar dinero.","El estonio es lengua finougria (pariente del finlandés y el húngaro, no del letón ni el lituano). El inglés es excelente, especialmente entre jóvenes. Frase útil: 'Aitäh' (gracias).","Tallin es la capital más digital del mundo: prácticamente todo se paga con tarjeta, incluso los puestos del mercado callejero. WiFi gratis en cualquier café."],"access":["Del muelle Vanasadam al casco antiguo: 15–20 min andando siguiendo señales 'Old Town'. Algunos cruceros ofrecen shuttle gratuito.","El casco antiguo amurallado es 100 % peatonal: callejuelas empedradas, cuidado con tacones."],"facts":["Tallin (Tallinn en estonio) significa 'castillo danés' (Taani linn): por la conquista danesa de 1219.","La leyenda dice que el rey Valdemar II de Dinamarca conquistó Toompea en la batalla del 15 de junio de 1219; cuando la batalla iba mal, una bandera roja con cruz blanca cayó del cielo y los daneses vencieron. Esa bandera es hoy la 'Dannebrog', la bandera danesa más antigua del mundo en uso continuo.","Estonia inventó Skype, recuperó la independencia en 1991, fue el primer país del mundo en celebrar elecciones online (2005) y ofrece e-Residency a extranjeros."]}},{"day":8,"date":"2026-09-18","title":"Helsinki: clasicismo del Norte y diseño finlandés","hero_image":"","timeline":[{"time":"08:00","icon":"⚓","title":"Atraque en Helsinki","description":"El barco amarra en uno de los puertos centrales de Helsinki: South Harbour (Eteläsatama) o Katajanokka, ambos a 10–15 min andando de la Plaza del Senado. Ventana amplia: 08:00–18:00 (10 h). Excelente puerto, ciudad caminable y compacta.","type":"checkin","duration_min":30},{"time":"08:30","icon":"🚶","title":"Salida hacia el centro","description":"Andar 10–15 min al oeste por el paseo marítimo hasta la Plaza del Mercado (Kauppatori), corazón portuario de la ciudad.","type":"transport","duration_min":15},{"time":"08:45","icon":"🛍️","title":"Kauppatori y Vanha Kauppahalli","description":"Plaza del Mercado en el puerto: puestos de pescado ahumado, salmón, salmonete, fresas silvestres, artesanía. Junto a la plaza, el Vanha Kauppahalli (Mercado Viejo, 1889), edificio de ladrillo rojo con interior de hierro forjado: charcuteras, panaderías, queso reno, café. Desayuno aquí ideal.","type":"visit","duration_min":45},{"time":"09:30","icon":"⛪","title":"Catedral de Uspenski (ortodoxa)","description":"La catedral ortodoxa más grande del oeste de Europa. Construida en 1862 sobre una colina rocosa al este del puerto. Estilo neobizantino con 13 cúpulas doradas (sobre fondo de ladrillo rojo) que simbolizan a Cristo y los 12 apóstoles. Recuerda la pertenencia de Finlandia al imperio ruso (1809–1917). 5 min andando del puerto.","type":"visit","duration_min":30},{"time":"10:00","icon":"🏛️","title":"Plaza del Senado y Catedral Luterana","description":"El mejor conjunto neoclásico del Norte de Europa: una plaza monumental diseñada en 1818–1852 por Carl Ludwig Engel para Alejandro I de Rusia, deliberadamente concebida como una pequeña San Petersburgo. La Catedral Luterana (1852) preside con su cúpula central de 80 m y sus cuatro torres laterales. Frente, el Palacio del Gobierno; a un lado, la Universidad y la Biblioteca Nacional. Tres minutos al norte de Uspenski.","type":"visit","duration_min":60},{"time":"11:00","icon":"🚇","title":"Tram 2 hasta el Museo Nacional","description":"Coger el tranvía 2 desde Senate Square (parada Kauppatori). Trayecto 10 min hasta 'Kansallismuseo'. Es la línea turística por excelencia: pasa por los puntos clave.","type":"transport","duration_min":15},{"time":"11:15","icon":"🪨","title":"Iglesia de la Roca (Temppeliaukio)","description":"Iglesia luterana excavada directamente en roca de granito, finalizada en 1969. Cúpula de cobre flotante de 24 m diámetro sostenida por 180 vigas radiales. La luz natural entra por las claraboyas del perímetro y rebota en las paredes de roca natural. Acústica excelente: hay conciertos diarios. 5 min andando del Museo Nacional.","type":"visit","duration_min":45},{"time":"12:00","icon":"🎼","title":"Monumento a Sibelius","description":"Tomar el tranvía 2 dirección Olympiaterminaali, 10 min, parada Sibeliuksen puisto. El Monumento a Sibelius (1967) es una escultura abstracta de 600 tubos de acero soldados que evocan tubos de órgano. Diseñada por Eila Hiltunen, fue criticada al inaugurarse (los conservadores querían algo figurativo), y se añadió una cabeza del compositor en bronce. Hoy es uno de los hitos del paseo turístico. Hermosos parques alrededor.","type":"visit","duration_min":45},{"time":"12:45","icon":"🍴","title":"Almuerzo en el centro","description":"Volver en tranvía al centro. Recomendamos Ravintola Sea Horse (cocina finesa clásica, 25–35 € por persona) o más informal: Story Restaurant en Old Market Hall (15–22 €) con vistas al puerto. Plato típico: lohikeitto (sopa de salmón con eneldo).","type":"meal","duration_min":75},{"time":"14:00","icon":"🛥️","title":"Ferry a Suomenlinna (opcional)","description":"Si queréis explorar la fortaleza marítima de Helsinki, ferry público HSL desde Kauppatori cada 20 min, 15 min de trayecto, 4,90 € ida y vuelta. Suomenlinna es Patrimonio UNESCO: fortaleza marítima sueca del XVIII en seis islas conectadas por puentes. Para una visita rápida (2 h): puerto, dique seco, museo, panorámica. Total ida-vuelta y visita: 2,5–3 h.","type":"activity","duration_min":180},{"time":"17:00","icon":"🚶","title":"Regreso al barco","description":"Andar al barco con calma. Margen amplio.","type":"transport","duration_min":20},{"time":"18:00","icon":"⚓","title":"Salida hacia Estocolmo","description":"Zarpamos rumbo oeste por el golfo de Finlandia, atravesando el archipiélago de Estocolmo de noche. Si os asomáis a cubierta a la mañana siguiente, veréis las islas pasar.","type":"transport","duration_min":0}],"places":[{"id":"helsinki-uspenski","name":"Catedral de Uspenski","coords":{"lat":60.1683,"lng":24.959},"review":"La mayor catedral ortodoxa del oeste de Europa. Construida 1862–1868 en Katajanokka, una colina rocosa frente al puerto, por el arquitecto ruso Aleksey Gornostayev (que no llegó a verla terminada). Estilo neobizantino: planta cuadrada con 13 cúpulas doradas sobre una fachada de ladrillo rojo y granito. Las 13 cúpulas representan a Cristo y los 12 apóstoles. Por dentro, decoración bizantina con iconostasio dorado, frescos y un brillante despliegue de candelabros. Recuerda que Finlandia fue parte del imperio ruso entre 1809 y 1917: hay todavía una minoría finlandesa ortodoxa de unos 60.000 fieles.","hours":"Lu-vi 09:30–18:00, sá 10:00–15:00, do 12:00–15:00. Cerrada algunos lunes","price":"Gratis (donativos)","tips":"Respetar las normas ortodoxas: mujeres pañuelo en la cabeza (hay préstamo), no hablar en voz alta, no foto durante misa. La vista de la catedral desde el puerto es de las postales más fotografiadas de Helsinki.","gmaps_url":"https://www.google.com/maps/@60.1683,24.959,17z?q=Catedral%20de%20Uspenski","verified_at":"2026-05-15"},{"id":"helsinki-senate","name":"Plaza del Senado y Catedral Luterana","coords":{"lat":60.1699,"lng":24.9526},"review":"El mejor conjunto neoclásico del Norte de Europa. Diseñado en 1818–1852 por el arquitecto alemán Carl Ludwig Engel a petición del zar Alejandro I, que quería transformar Helsinki en una pequeña San Petersburgo tras anexar Finlandia a Rusia en 1809. La Catedral Luterana (Tuomiokirkko, 1852) preside la plaza con su cúpula central de 80 m de altura, sus cuatro torres laterales y sus zinc-statues de los 12 apóstoles. Frente, el Palacio del Gobierno; a la izquierda, el edificio principal de la Universidad; a la derecha, la Biblioteca Nacional (1845), una de las más bonitas de Escandinavia. En el centro de la plaza, la estatua del zar Alejandro II (1894), curiosamente conservada tras la independencia.","hours":"Plaza 24 h. Catedral: lu-vi 09:00–18:00, sá-do 09:00–17:00","price":"Gratis","tips":"El interior de la catedral es sorprendentemente austero: blancura luterana clásica, casi vacío de decoración. Mejor verla por fuera y aprovechar la luz del mediodía para fotos. Se puede entrar en el cripta-museo (gratis, descenso 50 escalones, en construcción a veces).","gmaps_url":"https://www.google.com/maps/@60.1699,24.9526,17z?q=Plaza%20del%20Senado%20y%20Catedral%20Luterana","verified_at":"2026-05-15"},{"id":"helsinki-temppeliaukio","name":"Iglesia de la Roca (Temppeliaukio)","coords":{"lat":60.1734,"lng":24.9251},"review":"Una de las iglesias más originales del mundo: cavada directamente en una roca de granito en pleno centro de Helsinki, finalizada en 1969 por los hermanos arquitectos Timo y Tuomo Suomalainen. La cúpula de cobre flotante de 24 m de diámetro está sostenida por 180 vigas radiales que dejan pasar la luz natural por el perímetro. La acústica es tan excepcional (la roca crea un eco controlado de 4 segundos) que se hacen conciertos de música clásica casi a diario. Por fuera apenas se ve: solo una entrada baja en la roca. Por dentro, la sensación es de cueva primordial iluminada.","hours":"Lu-sá 10:00–17:30, do 11:45–17:30 (cerrada durante servicios)","price":"5 € adulto","tips":"Comprad la entrada online si vais en hora punta: cola de 30 min en verano. Conciertos a las 11:00 algunos días, gratis. Confirmar horarios en la web (templeaukio.fi).","gmaps_url":"https://www.google.com/maps/@60.1734,24.9251,17z?q=Iglesia%20de%20la%20Roca%20%28Temppeliaukio%29","verified_at":"2026-05-15"},{"id":"helsinki-sibelius","name":"Monumento a Sibelius","coords":{"lat":60.1822,"lng":24.9143},"review":"Escultura abstracta de 1967 dedicada al compositor finlandés Jean Sibelius (1865–1957), creador de la sinfonía 'Finlandia' que se convirtió en himno nacional informal durante la lucha contra la rusificación. La obra de Eila Hiltunen es un conjunto de 600 tubos de acero hueco soldados que forman una nube ondulada de 8,5 metros de altura. La crítica conservadora exigió incluir una cabeza figurativa del compositor: la cabeza de bronce que aparece junto al monumento es una concesión añadida posteriormente. Hoy es una de las obras de arte público más fotografiadas de Finlandia. Parque alrededor con vistas al mar.","hours":"24 h","price":"Gratis","tips":"Bonita en cualquier estación: en otoño el parque se llena de tonos rojos y dorados. Por la mañana hay menos turistas. Para llegar: tranvía 2 hasta Sibeliuksen puisto.","gmaps_url":"https://www.google.com/maps/@60.1822,24.9143,17z?q=Monumento%20a%20Sibelius","verified_at":"2026-05-15"},{"id":"helsinki-suomenlinna","name":"Suomenlinna (Fortaleza de Finlandia)","coords":{"lat":60.1453,"lng":24.9883},"review":"Fortaleza marítima construida por la corona sueca entre 1748 y 1809 sobre seis islas conectadas por puentes a la entrada del puerto de Helsinki. Su nombre original era Sveaborg ('castillo sueco'). Tras la guerra finlandesa pasó a manos rusas (1809) y luego finlandesas (1918). En 1991 fue declarada Patrimonio UNESCO. Hoy es a la vez fortaleza-museo y barrio residencial: viven unas 850 personas en las antiguas barracas. Se visitan: el dique seco real (el más antiguo del mundo aún en uso), el museo Suomenlinna, túneles, baterías de cañones, panoramas hacia el archipiélago. Visita de 2–3 h.","hours":"Islas 24 h. Museos: 11:00–18:00 (verano)","price":"Acceso gratis. Ferry HSL: 4,90 € ida y vuelta. Museo Suomenlinna: 10 €","tips":"Ferry público HSL desde Kauppatori cada 20 min: mucho mejor que ferries privados (que cuestan el doble). Llevar capa de abrigo: hace viento. Es la mitad del paseo por las islas; la otra mitad es estar dentro del museo. Bar Walhalla en la isla principal sirve cerveza local.","gmaps_url":"https://www.google.com/maps/@60.1453,24.9883,17z?q=Suomenlinna%20%28Fortaleza%20de%20Finlandia%29","verified_at":"2026-05-15"}],"restaurants":[{"name":"Story Restaurant — Old Market Hall","meal":"almuerzo","speciality":"Lohikeitto (sopa de salmón con eneldo), karjalanpiirakka (empanadillas de arroz)","price_range":"€€","reservation_required":false,"notes":"En el Vanha Kauppahalli (Old Market Hall) frente al puerto. Buena ubicación, vistas al mar, cocina finlandesa casual. 18–25 € por persona. Buen sitio para probar el lohikeitto auténtico.","gmaps_url":"https://www.google.com/maps/search/Story+Restaurant+Old+Market+Hall+Helsinki/@60.1678,24.9526,16z"}],"alternative_plans":{"more_time":"Si Suomenlinna no os atrae, podéis dedicar la tarde al Distrito del Diseño (Design District Helsinki): 200 tiendas, galerías y estudios entre las calles Erottajankatu, Korkeavuorenkatu y Punavuori. Marca finlandesa estrella: Marimekko, Iittala, Artek, Aarikka. Marimekko Outlet Helsinki Centre en Pohjoisesplanadi 33.","less_time":"Si os agobia el itinerario, omitir Suomenlinna y Sibelius. Helsinki imprescindible: Plaza Mercado + Uspenski + Plaza del Senado + Catedral + Iglesia de la Roca. 3,5 h.","rainy_day":"Si llueve, omitir Suomenlinna sin duda. El Museo Ateneum (galería nacional, gran arte finlandés, 22 €) o el Kiasma (arte contemporáneo, 18 €) son refugios perfectos."},"logistics":{"driving_km":0,"driving_time_min":0,"walking_km":5,"walking_time_min":75,"public_transport":"Centro caminable. Para Iglesia de la Roca y Sibelius: tranvía 2 (línea turística circular). Billete sencillo: 3,10 € (en máquina). Day ticket: 9 €, incluye también el ferry a Suomenlinna. Tip: la app HSL permite comprar billetes con tarjeta."},"info":{"travel_tips":["Finlandia está en la zona euro. No hay que cambiar moneda.","El finlandés es lengua finougria, sin parentesco con el sueco. Pero Finlandia es bilingüe oficial finés-sueco. Casi todo el mundo habla inglés. Frase útil: 'Kiitos' (gracias).","Helsinki es muy cara pero más razonable que Estocolmo. Un café cuesta 4 €, una cerveza 8 €, un menú del día 15 €. Las tarjetas se aceptan en todas partes; el efectivo casi no se usa."],"access":["Del puerto South Harbour o Katajanokka al centro: 10–15 min andando.","Tranvía 2 (línea verde) es la 'turística': pasa por casi todos los puntos importantes en bucle. Billete sencillo 3,10 €."],"facts":["Helsinki tiene 6 horas de luz solar adicional respecto a Madrid en pleno verano. En septiembre, el día tiene 12 h.","Eero Saarinen, autor del aeropuerto JFK de Nueva York y de la Gateway Arch de Saint Louis, era hijo del arquitecto finlandés Eliel Saarinen.","Helsinki fue Capital Mundial del Diseño en 2012 y la ciudad alberga la sede de las principales marcas finlandesas (Marimekko, Iittala, Artek, Fiskars)."]}},{"day":9,"date":"2026-09-19","title":"Estocolmo: Gamla Stan, Palacio Real y archipiélago","hero_image":"","timeline":[{"time":"07:30","icon":"🛥️","title":"Travesía por el archipiélago","description":"Despertarse a tiempo: el barco entra en el archipiélago de Estocolmo a partir de las 06:00. Las dos horas de travesía hacia el centro atraviesan 30.000 islas e islotes con casas rojas de madera, bosques de abeto y faros minúsculos. Desayuno en cubierta si el tiempo acompaña.","type":"activity","duration_min":90},{"time":"09:00","icon":"⚓","title":"Atraque en Frihamnen","description":"El barco amarra en Frihamnen (puerto franco), 4 km al noreste del centro. El barco se queda fondeado 2 noches: ventana de 09:00 (día 9) hasta 16:00 (día 10). Esto da prácticamente dos días completos en Estocolmo.","type":"checkin","duration_min":30},{"time":"09:30","icon":"🚌","title":"Bus 76 al centro","description":"Desde Frihamnen, bus 76 dirección 'Norra Hammarbyhamnen', parada en pier 638 (al lado del barco). Trayecto 20 min, baja en 'Slottsbacken' (Palacio Real) o 'Kungsträdgården' (jardín real). Tickets: 39 SEK (≈ 3,50 €) sencillo, 165 SEK (15 €) día completo (Reskassa). Compra en la app SL o quiosco del puerto.","type":"transport","duration_min":30},{"time":"10:00","icon":"🏰","title":"Palacio Real (Kungliga slottet)","description":"El palacio real más grande de Europa todavía en uso (más de 600 estancias). Construido entre 1697 y 1754 en estilo barroco italiano sobre las ruinas del Castillo de las Tres Coronas, que se incendió en 1697. La familia real ya no vive aquí (residen en Drottningholm) pero es la oficina real. Se visitan: Apartamentos Reales, Tesoro Real (joyas de la corona, cetros, espadas), Sala de las Damas, Capilla Real, Museo de las Tres Coronas (ruinas medievales del antiguo castillo). Entrada combinada: 220 SEK (20 €).","type":"visit","duration_min":90},{"time":"11:30","icon":"🎖️","title":"Cambio de la Guardia","description":"Ceremonia diaria a las 12:15 (en domingo a las 13:15) en el patio exterior del Palacio Real. La Guardia Real Sueca con uniformes ceremoniales y banda militar marcha desde el cuartel de Cavallinen hasta el palacio. Espectáculo gratuito de 40 min. Llegad a las 12:00 para sitio.","type":"activity","duration_min":45},{"time":"12:15","icon":"🚶","title":"Paseo por Gamla Stan","description":"El casco viejo de Estocolmo es una isla minúscula (15 ha) entre las dos partes de la ciudad: calles empedradas estrechas del XVI, casas pintadas de ocre y rojo escandinavo, fachadas con frontones escalonados. La Stortorget (Plaza Mayor) con el Museo Nobel y casa de las gerarías (Börshuset). La calle más fotogénica: Mårten Trotzigs gränd, callejón medieval de 90 cm de ancho.","type":"visit","duration_min":90},{"time":"13:45","icon":"🍴","title":"Almuerzo en Gamla Stan","description":"Recomendamos Den Gyldene Freden (la Tregua Dorada, 1722): el restaurante más antiguo de Estocolmo todavía en uso, donde se reúnen los académicos de la Academia Sueca cada jueves para elegir el Nobel de Literatura. Cocina sueca tradicional: kötbullar (albóndigas), gravlax (salmón curado), arenques. 25–40 € por persona. Reservar online si es posible.","type":"meal","duration_min":75},{"time":"15:00","icon":"⛪","title":"Storkyrkan y Riddarholmskyrkan","description":"Storkyrkan (Catedral Mayor): la iglesia más antigua de Estocolmo (siglo XIII), donde se coronaban los reyes suecos hasta 1907 y se casó la actual reina Silvia en 1976. Por dentro: la escultura ecuestre de San Jorge y el Dragón (1489) en madera policromada, una obra maestra del gótico tardío. A 5 min al oeste, en la isla vecina de Riddarholmen, la Iglesia de los Caballeros: panteón real desde el siglo XVII, donde reposan Gustavo II Adolfo y Carlos XII entre otros.","type":"visit","duration_min":60},{"time":"16:00","icon":"🌅","title":"Paseo a Södermalm (opcional)","description":"Cruzar a la isla de Södermalm, el barrio bohemio de Estocolmo. Subir al Monteliusvägen, mirador panorámico gratuito sobre el ayuntamiento y Gamla Stan. Una de las mejores vistas de la ciudad, especialmente al atardecer. Alternativa: callejear por Söder con sus tiendas vintage, cafés y bares.","type":"activity","duration_min":120},{"time":"18:00","icon":"🍷","title":"Cena en Söder o vuelta al barco","description":"Cenáis en Södermalm (Pelikan o Kvarnen para cocina sueca tradicional, 30–45 €) o volved al barco. Si volvéis, bus 76 dirección puerto desde Slussen.","type":"free","duration_min":120},{"time":"21:00","icon":"🚌","title":"Vuelta al barco","description":"Volver tranquilamente al barco con bus 76 o taxi (≈ 250 SEK / 22 €).","type":"transport","duration_min":30}],"places":[{"id":"estocolmo-palacio-real","name":"Palacio Real (Kungliga slottet)","coords":{"lat":59.3268,"lng":18.0717},"review":"El palacio real con más estancias en uso de Europa: 600+ habitaciones distribuidas en cuatro fachadas que forman un cuadrilátero compacto. Construido entre 1697 y 1754 en estilo barroco italiano por el arquitecto Nicodemus Tessin el Joven sobre las ruinas del Tres Coronas (incendiado en 1697). La fachada exterior es severa, pero los apartamentos interiores son una obra maestra del barroco tardío: salas de los embajadores, sala del banquete real, escalera ceremonial. La familia real ya no vive aquí desde 1981 (residen en Drottningholm a 11 km) pero el palacio sigue siendo la oficina oficial.","hours":"Diario 10:00–17:00 (verano), 10:00–16:00 (invierno). Cerrado algunos días por funciones de Estado","price":"Entrada combinada (Apartamentos Reales + Tesoro + Museo Tres Coronas): 220 SEK (20 €)","tips":"El Tesoro Real expone las joyas de la corona, cetros y la espada de Gustavo Vasa. El Museo de las Tres Coronas en el sótano deja ver las ruinas medievales del castillo anterior. El billete vale para todo el día, podéis salir y volver.","gmaps_url":"https://www.google.com/maps/@59.3268,18.0717,17z?q=Palacio%20Real%20%28Kungliga%20slottet%29","verified_at":"2026-05-15"},{"id":"estocolmo-gamla-stan","name":"Gamla Stan (Ciudad Vieja)","coords":{"lat":59.3251,"lng":18.0711},"review":"La ciudad vieja de Estocolmo: una isla diminuta (15 ha) entre las dos partes modernas de la capital. Fundada por Birger Jarl en 1252, conserva la trama medieval intacta: callejuelas empedradas estrechas y sinuosas, casas burguesas del XVI y XVII pintadas de ocre, rojo y amarillo escandinavo, plazas pequeñas. El corazón es la Stortorget (Plaza Mayor), donde se cometió en 1520 el 'baño de sangre de Estocolmo' por orden de Christian II de Dinamarca (90 nobles suecos decapitados): la fachada roja del actual Museo Nobel es de aquella época. La calle Mårten Trotzigs gränd, con sus 90 cm de ancho, es la calle más estrecha de la ciudad y una de las más estrechas de Europa.","hours":"Calles 24 h. Museo Nobel: 10:00–17:00 (cerrado lunes)","price":"Calles gratis. Museo Nobel: 130 SEK (12 €)","tips":"Empezar el paseo por la Stortorget, bajar a Köpmangatan (calle más antigua), entrar en Mårten Trotzigs gränd, salir por el Iron Square hasta el Palacio Real. Tiendas de souvenirs (los renos de fieltro son icónicos) abundantes y caros.","gmaps_url":"https://www.google.com/maps/@59.3251,18.0711,17z?q=Gamla%20Stan%20%28Ciudad%20Vieja%29","verified_at":"2026-05-15"},{"id":"estocolmo-storkyrkan","name":"Storkyrkan (Catedral Mayor)","coords":{"lat":59.3258,"lng":18.0709},"review":"La iglesia más antigua de Estocolmo, fundada en el siglo XIII, junto al Palacio Real. Aquí se coronaban los reyes suecos hasta 1907 y se casó la actual reina Silvia con Carlos XVI Gustavo en 1976. Estilo gótico tardío con bóvedas estrelladas. La joya: la escultura ecuestre en madera policromada de San Jorge y el Dragón (1489), una obra maestra del gótico tardío atribuida a Bernt Notke, conmemora la victoria del rey Sten Sture el Viejo sobre los daneses en 1471. El dragón mide 4 metros y conserva los colmillos originales de cabra.","hours":"Diario 09:00–16:00 (sin servicios)","price":"75 SEK (7 €)","tips":"La iglesia organiza conciertos de órgano los domingos a las 14:00. Si vais en silencio en otro momento, la acústica es maravillosa.","gmaps_url":"https://www.google.com/maps/@59.3258,18.0709,17z?q=Storkyrkan%20%28Catedral%20Mayor%29","verified_at":"2026-05-15"},{"id":"estocolmo-monteliusvagen","name":"Monteliusvägen (mirador)","coords":{"lat":59.3199,"lng":18.0628},"review":"Un sendero peatonal a media altura sobre la isla de Södermalm, con vistas espectaculares y gratuitas sobre el ayuntamiento, Riddarholmen, Gamla Stan y el lago Mälaren. Tramo de 400 metros con bancos. Al atardecer en otoño es uno de los lugares más fotografiados de Estocolmo. Para acceder: subir las escaleras desde Bastugatan en Södermalm. Sin transporte directo, pero a 15 min andando del puente de Centralbron.","hours":"24 h","price":"Gratis","tips":"Mejor luz al final de la tarde (sol del oeste). Llevar abrigo: hace viento. Camino pavimentado, sin barandilla en algunos tramos.","gmaps_url":"https://www.google.com/maps/@59.3199,18.0628,17z?q=Monteliusv%C3%A4gen%20%28mirador%29","verified_at":"2026-05-15"}],"restaurants":[{"name":"Den Gyldene Freden","meal":"almuerzo","speciality":"Kötbullar (albóndigas suecas con puré, salsa de carne y arándanos rojos), gravlax","price_range":"€€€","reservation_required":true,"notes":"Österlånggatan 51, Gamla Stan. El restaurante más antiguo de Estocolmo en uso continuo (desde 1722). Propiedad de la Academia Sueca: aquí se reúnen los académicos cada jueves para deliberar sobre el Nobel de Literatura. Cocina sueca tradicional. 30–45 € por persona. Reservar online.","gmaps_url":"https://www.google.com/maps/search/Den+Gyldene+Freden+Stockholm/@59.3251,18.0711,16z"}],"alternative_plans":{"more_time":"Como el barco se queda otra noche, podéis dejar para mañana lo más cansado (Vasa, Skansen, Djurgården). Hoy es bueno para Gamla Stan + Palacio + Södermalm sin prisas.","less_time":"Si volvéis pronto al barco: Palacio Real + cambio de guardia + Gamla Stan + 1 hora de comer. Total: 4 h. Mañana hay otro día completo.","rainy_day":"Las calles de Gamla Stan son agradables incluso bajo lluvia; los museos abundan: Museo Nobel (12 €), Postmuseum, Livrustkammaren (Armería Real, gratis, dentro del palacio)."},"logistics":{"driving_km":0,"driving_time_min":0,"walking_km":6,"walking_time_min":90,"public_transport":"Frihamnen → Centro: bus 76 cada 10 min, 39 SEK sencillo (3,50 €), 25 min. App SL para tickets digitales. Toda Gamla Stan es peatonal: no entran coches. Para Södermalm: ferry o cruzar Centralbron andando."},"info":{"travel_tips":["Suecia NO está en la zona euro. La moneda es la corona sueca (SEK). 1 EUR ≈ 11 SEK. Pero no necesitáis cambiar: Suecia es prácticamente cashless (sin efectivo). Todo se paga con tarjeta, hasta los puestos del mercado callejero.","Comprad la tarjeta de transporte 'Reskassa' o usad la app SL desde el móvil. Tickets sueltos en metro/bus también funcionan.","Estocolmo es de las ciudades más caras del mundo: una cerveza 10 €, café 4–5 €, menú del día 18–22 €."],"access":["El puerto Frihamnen está a 4 km del centro: imposible andar. Bus 76 (línea directa) o taxi (≈ 22 €).","Una vez en Gamla Stan, todo se hace andando. Para cruzar a Södermalm o Djurgården, 15 min a pie."],"facts":["Estocolmo está construida sobre 14 islas conectadas por 57 puentes. La ciudad fundada por Birger Jarl en 1252 fue concebida como tapón naval: bloqueaba el paso de barcos enemigos al lago Mälaren.","El nombre Stockholm viene de 'stock' (tronco) y 'holme' (islote): el lugar donde los suecos clavaban troncos en el agua para cerrar el paso.","La Academia Sueca, fundada en 1786 por Gustavo III, sigue eligiendo los Premios Nobel de Literatura desde 1901 reuniéndose en Den Gyldene Freden."]}},{"day":10,"date":"2026-09-20","title":"Estocolmo: Vasa, Skansen y Djurgården","hero_image":"","timeline":[{"time":"08:00","icon":"🥐","title":"Desayuno y salida temprana","description":"El barco lleva atracado desde ayer en Frihamnen. Ventana de hoy: hasta las 16:00. Desayuno temprano para aprovechar el día.","type":"free","duration_min":60},{"time":"09:00","icon":"🚌","title":"Bus 76 a Djurgården","description":"Coger el bus 76 desde Frihamnen dirección 'Norra Hammarbyhamnen' y bajar en 'Djurgårdsbron'. Trayecto 20 min, 39 SEK. Si tenéis Reskassa de ayer, ya lo lleváis cargado.","type":"transport","duration_min":25},{"time":"09:30","icon":"⛵","title":"Museo Vasa (Vasamuseet)","description":"El museo más visitado de Escandinavia: alberga el Vasa, buque de guerra sueco de 1628 que se hundió a los 1.300 metros de su botadura por mal diseño y fue reflotado intacto en 1961 tras 333 años en el fondo del puerto. La nave, de 69 m de eslora y tres palos, se conserva al 98 %: la madera original de roble, las 700 esculturas de la decoración, los cañones, las cuerdas. Es la única embarcación del siglo XVII conservada íntegra en el mundo. El museo, construido en 1990 alrededor del barco, tiene 5 plantas con exposiciones complementarias: la corte de Gustavo Adolfo, la vida a bordo, el reflotamiento.","type":"visit","duration_min":120},{"time":"11:30","icon":"🌲","title":"Skansen (museo al aire libre)","description":"El museo al aire libre más antiguo del mundo (fundado en 1891 por Artur Hazelius). Skansen reúne 150 edificios históricos de toda Suecia trasladados desde sus emplazamientos originales: granjas medievales, iglesias rurales, talleres de artesanía, casas burguesas del XVII, escuelas, panadería. También incluye un zoo nórdico con animales autóctonos (renos, alces, lobos, glotones, búhos). Es la mejor manera de entender la Suecia tradicional. Visita relajada: 2–3 h.","type":"visit","duration_min":150},{"time":"14:00","icon":"🍴","title":"Almuerzo en Skansen","description":"Comer en Solliden Restaurang (Skansen, vistas al puerto) o en uno de los cafés del museo. Smörgåsbord nórdico, pan sueco con queso y arándanos, café con kanelbulle (bollo de canela). 18–28 € por persona.","type":"meal","duration_min":60},{"time":"15:00","icon":"🚌","title":"Regreso al barco","description":"Bus 76 dirección Frihamnen desde Djurgårdsbron. 20 min de trayecto. Llegada al puerto con margen.","type":"transport","duration_min":30},{"time":"15:30","icon":"🚢","title":"Embarque","description":"Embarque con tiempo. Última ciudad del crucero: a partir de aquí, navegación.","type":"checkin","duration_min":30},{"time":"16:00","icon":"⚓","title":"Salida del archipiélago","description":"El barco zarpa rumbo sur. Las dos horas siguientes son una despedida espectacular: el barco serpentea entre las miles de islas del archipiélago de Estocolmo de vuelta al Báltico abierto. Buena hora para ver desde cubierta.","type":"transport","duration_min":0}],"places":[{"id":"estocolmo-vasa","name":"Museo Vasa (Vasamuseet)","coords":{"lat":59.328,"lng":18.0915},"review":"El museo más visitado de Escandinavia (1,5 millones de visitantes/año). Alberga el Vasa, buque de guerra sueco encargado por el rey Gustavo II Adolfo, considerado en su época el barco más poderoso del mundo. El 10 de agosto de 1628, en su viaje inaugural ante miles de espectadores en el puerto de Estocolmo, una racha de viento hizo escorar el barco; sus portañolas inferiores quedaron bajo el agua y el Vasa se hundió a los 1.300 metros de su botadura. 30 de los 150 tripulantes murieron. La causa: el rey ordenó añadir una segunda cubierta de cañones que desequilibró el centro de gravedad. El barco yació en el fondo durante 333 años en agua dulce salobre del puerto, lo que impidió que las teredos (gusanos de mar salada) consumieran la madera. Fue reflotado entero en 1961 tras meses de planificación. Hoy se conserva al 98 %: 69 m de eslora, tres palos, 700 esculturas decorativas originales, cañones, cuerdas, ropa de marineros.","hours":"Diario 08:30–18:00 (jun-ago), 10:00–17:00 (resto). Cerrado 23-25 dic y 1 enero","price":"230 SEK (21 €) adulto. Menores 18 años gratis","tips":"Llegad temprano: a las 09:30 estaréis solos casi. A partir de las 11:00 llegan los grupos de cruceros. Hay audioguía gratis en castellano en la entrada. Plantear 1,5–2 h dentro: hay 5 plantas con exposiciones.","gmaps_url":"https://www.google.com/maps/@59.328,18.0915,17z?q=Museo%20Vasa%20%28Vasamuseet%29","verified_at":"2026-05-15"},{"id":"estocolmo-skansen","name":"Skansen","coords":{"lat":59.326,"lng":18.1027},"review":"El museo al aire libre más antiguo del mundo, fundado en 1891 por Artur Hazelius para preservar la Suecia tradicional ante la industrialización. Reúne 150 edificios históricos trasladados desde sus emplazamientos originales: granjas medievales, iglesias rurales del XII, talleres de cerámica, panadería de leña, casas burguesas barrocas, escuela del XIX. Cada edificio está habitado por personal en vestimenta de la época que enseña los oficios: tejer, soplar vidrio, hornear pan, herrar caballos. También incluye un zoo nórdico con animales autóctonos: renos, alces, lobos, glotones, búhos, linces. En Navidad se celebra el mercado más popular de Suecia. Skansen ocupa 30 hectáreas en la isla de Djurgården.","hours":"Diario 10:00–17:00 (sept). Verano 09:00–22:00","price":"230 SEK (21 €) adulto","tips":"Llevar zapato cómodo: hay mucho que caminar (3 km de senderos). El zoo está al fondo. Café Petissan junto a la entrada hace los mejores kanelbullar de Estocolmo.","gmaps_url":"https://www.google.com/maps/@59.326,18.1027,17z?q=Skansen","verified_at":"2026-05-15"},{"id":"estocolmo-djurgarden","name":"Djurgården (isla museística)","coords":{"lat":59.3266,"lng":18.1042},"review":"Isla-parque del este de Estocolmo, antigua reserva de caza real del siglo XV (de ahí su nombre: 'jardín de los animales'). Hoy es la isla museística de la ciudad: concentra el Vasa, Skansen, el Museo Nórdico, el ABBA Museum, el Junibacken (museo Astrid Lindgren), el Spritmuseum (museo del alcohol) y el Museo Marítimo, además de jardines, restaurantes y un parque de atracciones (Gröna Lund). Es también lugar de paseo predilecto de los estocolmenses los fines de semana: rutas por bosque, lago Djurgårdsbrunnsviken, picnic. Cero coches en muchos tramos.","hours":"Acceso libre 24 h","price":"Acceso isla gratis. Museos individuales: 20–25 € cada uno","tips":"Si tenéis interés por ABBA y bailar: ABBA Museum (320 SEK / 29 €, reservar online). Si tenéis hijos pequeños (no es el caso aquí): Junibacken (200 SEK).","gmaps_url":"https://www.google.com/maps/@59.3266,18.1042,17z?q=Djurg%C3%A5rden%20%28isla%20muse%C3%ADstica%29","verified_at":"2026-05-15"}],"restaurants":[{"name":"Solliden Restaurang (Skansen)","meal":"almuerzo","speciality":"Smörgåsbord nórdico, salmón con eneldo, kötbullar","price_range":"€€","reservation_required":false,"notes":"Dentro del recinto de Skansen, con vistas al puerto. Pabellón histórico de madera. Buffet sueco con platos tradicionales. 25–30 € por persona. Domingo de buffet familiar.","gmaps_url":"https://www.google.com/maps/search/Solliden+Restaurang+Skansen+Stockholm/@59.326,18.1027,16z"}],"alternative_plans":{"more_time":"Si Skansen se hace pesado, añadir el Museo Nórdico (Nordiska museet) en Djurgården: museo de etnografía sueca en un palacio neogótico monumental. 165 SEK (15 €).","less_time":"Si la ventana del barco se acortara, priorizar Vasa por encima de todo: es la visita única e irrepetible de Estocolmo. Sin Skansen, total: 2,5 h.","rainy_day":"Con lluvia, el Vasa cubierto resuelve la mañana. Para la tarde, sustituir Skansen (al aire libre) por el Moderna Museet (arte moderno, gratis colección permanente) en la isla de Skeppsholmen o por el Museo Nórdico cubierto."},"logistics":{"driving_km":0,"driving_time_min":0,"walking_km":3,"walking_time_min":45,"public_transport":"Frihamnen → Djurgårdsbron: bus 76, 25 min. Djurgården es una isla peatonal accesible por el puente. El tranvía 7 también llega desde Sergels Torg en el centro."},"info":{"travel_tips":["Comprad entradas online para el Vasa el día anterior: la cola en taquilla puede ser de 1 hora en hora punta (vasamuseet.se).","El billete combinado Vasa + Skansen no existe oficialmente, pero algunos años hay descuento si compráis los dos en taquilla. Preguntar.","El Vasa NO permite fotos con flash (la luz UV daña la madera de 400 años). Los bastones, paraguas y bolsas grandes deben dejarse en la consigna gratuita."],"access":["Vasa y Skansen están en Djurgården, isla museística. Acceso por el puente Djurgårdsbron (peatonal) o por el tranvía 7.","Del barco a Djurgården en bus 76 directo: 25 minutos."],"facts":["El Vasa pesa 1.210 toneladas, mide 69 m de eslora, 11 m de manga, 52 m de altura desde la quilla al penol del mástil mayor.","Cuando se reflotó en 1961, su conservación duró 17 años: se le impregnó con polietilenglicol para sustituir el agua de la madera y evitar el colapso al secarse.","Skansen dio nombre al concepto general de 'museo al aire libre' (skansen significa 'la fortaleza' en sueco, por la antigua fortaleza militar del lugar)."]}},{"day":11,"date":"2026-09-21","title":"Día de navegación: travesía a Copenhague","hero_image":"","timeline":[{"time":"08:00","icon":"🥐","title":"Desayuno tranquilo","description":"Despertar con calma. El barco navega rumbo sudoeste desde Estocolmo hacia Copenhague, atravesando el Báltico abierto. La travesía dura unas 22 horas con escalas técnicas mínimas.","type":"free","duration_min":90},{"time":"10:00","icon":"🛀","title":"Mañana de spa, gimnasio o piscina","description":"Aprovechar las instalaciones del barco: spa, sauna, gimnasio, piscina cubierta, hidromasaje. Tras 8 días intensos, el cuerpo lo agradece. Consultad los servicios y horarios en la guía del barco o el diario de actividades.","type":"activity","duration_min":120},{"time":"12:00","icon":"🍴","title":"Almuerzo a bordo","description":"Comida en alguno de los restaurantes del barco. Excelente oportunidad para probar los espacios premium si los tenéis incluidos.","type":"meal","duration_min":90},{"time":"14:00","icon":"📚","title":"Tarde de descanso y lectura","description":"Tarde tranquila en cubierta (si el tiempo acompaña) o en los salones interiores. Lectura, juegos de mesa, conversaciones. Las ventanas dan al horizonte abierto. En el Báltico hay vida marina visible: focas grises, gaviotas tridáctilas, alcatraces.","type":"free","duration_min":180},{"time":"17:00","icon":"🎭","title":"Actividades del barco","description":"Los cruceros suelen programar actividades especiales en los días de navegación: conferencias sobre los destinos, demostraciones culinarias, talleres, espectáculos en el teatro. Consultad el diario del barco.","type":"activity","duration_min":120},{"time":"19:30","icon":"🍷","title":"Cena de despedida","description":"Última cena formal del crucero. Algunas navieras la organizan como 'cena de despedida' con menú especial. Aprovechad: mañana es desembarque y vuelos.","type":"meal","duration_min":120},{"time":"21:30","icon":"🛌","title":"Recogida de equipaje","description":"Preparar las maletas para el desembarque: la mayoría de navieras pide que las dejéis fuera del camarote antes de medianoche. Conservar siempre la documentación, medicación y un cambio de ropa para el día siguiente.","type":"free","duration_min":60}],"places":[],"restaurants":[],"alternative_plans":{"more_time":"Aprovechar para ver los servicios premium del barco: cena en restaurante de pago opcional (sushi, parrilla, italiano gourmet), copa en el lounge panorámico, masaje en el spa.","less_time":"Si os cansa estar a bordo, los cruceros tienen biblioteca, sala de juegos, casino. Hablad con la recepción si necesitáis distracciones específicas.","rainy_day":"Plan ideal para día de lluvia: spa, sauna, piscina cubierta, restaurantes, espectáculos, biblioteca. No necesitáis salir."},"logistics":{"driving_km":0,"driving_time_min":0,"walking_km":0,"walking_time_min":0,"public_transport":"Día completo en alta mar. Navegación de Estocolmo a Copenhague: aprox. 600 millas náuticas, 22 h a 15 nudos."},"info":{"travel_tips":["Aprovechad para ordenar las fotos hechas durante el viaje: el almacenamiento del móvil estará al límite.","Recoged el resguardo de gastos de a bordo en recepción: a veces hay cargos disputables o sin reconocer. Mejor revisarlos un día antes del desembarque.","Pasaporte, tarjeta sanitaria europea, billete de vuelo a Alicante: ponedlos juntos en el equipaje de mano. NO los facturéis en la maleta grande."],"access":[],"facts":["El Báltico es un mar joven (apareció hace 14.000 años tras la última glaciación), poco profundo (media 55 m), poco salado (3-8 g/l vs 35 g/l del Atlántico) y con casi nula marea. Estas peculiaridades permitieron la perfecta conservación del barco Vasa.","El Báltico tiene un único estrecho de salida hacia el Atlántico: el Skagerrak entre Dinamarca y Noruega. Por eso es prácticamente un mar interior."]}},{"day":12,"date":"2026-09-22","title":"Llegada a Copenhague, desembarque y vuelta a Alicante","hero_image":"","timeline":[{"time":"07:00","icon":"⚓","title":"Aproximación a Copenhague","description":"El barco navega ya por el estrecho del Øresund, entre Dinamarca y Suecia. Si os asomáis a cubierta veréis el espectacular Puente del Øresund (16 km, mitad puente mitad túnel, abierto en 2000) que conecta Copenhague con Malmö.","type":"activity","duration_min":60},{"time":"08:00","icon":"🚢","title":"Atraque en Oceankaj","description":"Llegada al puerto Oceankaj de Copenhague. Desembarque organizado por bloques: la naviera os asignará un color/letra y un horario. Tened paciencia: salir antes de las 09:30 es difícil.","type":"checkin","duration_min":90},{"time":"09:30","icon":"🧳","title":"Recogida de equipaje","description":"Las maletas grandes ya deberían estar en una zona común del muelle agrupadas por color. Localizarlas y dirigirse a la salida de aduana.","type":"checkout","duration_min":30},{"time":"10:00","icon":"🚖","title":"Traslado al aeropuerto","description":"Opciones desde Oceankaj al aeropuerto de Copenhague-Kastrup (CPH): (1) Taxi/Uber: la opción más cómoda con maletas. 350–450 DKK (47–60 €), 25 min. (2) Bus 25 hasta estación Østerport + tren/metro al aeropuerto. ≈ 60 min, 36 DKK (4,80 €) por persona. (3) Bus directo cuando la naviera lo ofrece (consultar). Decidir según hora del vuelo y comodidad.","type":"transport","duration_min":30},{"time":"10:30","icon":"🛫","title":"Aeropuerto de Copenhague","description":"Aeropuerto eficiente y cómodo. Recomendable estar 2 h antes del vuelo. Tras facturación y control: hay tiendas duty-free de diseño escandinavo (Iittala, Hay, Marimekko). Última oportunidad para comprar souvenirs daneses.","type":"checkin","duration_min":120},{"time":"13:00","icon":"✈️","title":"Vuelo de regreso a Alicante","description":"Despegue rumbo Alicante. Vuelo directo dura unas 3:30 h. Llegada aproximada a Alicante: 17:30–18:00 (hora española).","type":"transport","duration_min":210}],"places":[],"restaurants":[],"alternative_plans":{"more_time":"Si el vuelo es tarde por la noche, podéis aprovechar para dejar el equipaje en la consigna del aeropuerto (90 DKK / 12 € por bulto) y volver al
